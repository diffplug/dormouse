<template>
  <style>#root{position:absolute;inset:0}</style>
  <div id="root" data-composition-id="two" data-width="1920" data-height="1080">
    <div id="two-stage" class="stage"><div id="two-word" style="position:absolute;left:100px;top:400px;font-size:160px">two</div><div id="two-dot" style="position:absolute;left:100px;top:800px;width:80px;height:80px;border-radius:50%;background:#f80"></div></div>
  </div>
  <script>
    (() => {
      const sc = S.begin("two"); const { tl } = sc;
      const el = document.getElementById("two-word");
      sc.lines.forEach((l) => l.words.forEach((x) => { if (x.start >= 0 && x.start < sc.dur) tl.set(el, { textContent: x.text }, x.start); }));

      window.__timelines["two"] = tl;
    })();
  </script>
</template>
