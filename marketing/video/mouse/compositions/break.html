<template>
  <style>#root{position:absolute;inset:0}</style>
  <div id="root" data-composition-id="break" data-width="1920" data-height="1080">
    <div id="break-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const sc = S.begin("break"); const { tl, stage, w, line } = sc;
      const cam = S.html(stage, `<div class="abs" style="width:1920px;height:1080px" data-layout-ignore></div>`);
      const { straps } = S.train(cam, 1920, tl, sc.dur);
      // The wind-up turns the car yellow behind the two of them.
      const glow = S.html(cam, `<div class="abs" style="width:1920px;height:1080px;background:var(--sun);opacity:0"></div>`);
      const HX = 740, GX = 1200, SEAT = 866;
      const him = S.mouse(cam, { scale: 1.3, mullet: true });
      S.stand(him, HX, SEAT);
      const her = S.mouse(cam, { scale: 1.22, ...S.girlLook });
      S.stand(her, GX, SEAT);
      gsap.set(him.armL, { rotation: -30 }); gsap.set(him.armR, { rotation: 30 });
      gsap.set(him.eyes, { y: 9 });
      const phone = S.heldPhone(cam, HX, 690, 1.25);
      S.trainSeat(cam, 1920);
      S.ground(cam, "#8fa9a2");
      S.bop(tl, him, sc.beats, { amp: 0.6, to: sc.bar(19) });
      S.bop(tl, her, sc.beats, { amp: 0.6, to: sc.bar(19) });
      sc.beats.forEach((b) => { tl.fromTo(cam, { y: 6 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, b.t); tl.to(straps, { rotation: b.n % 2 ? 9 : -9, duration: 0.3, ease: "sine.inOut" }, b.t); });
      S.thumbing(tl, phone, him, 0, line("br2").start - 0.2);
      const [b1, b2, b3, b4] = ["br1", "br2", "br3", "br4"].map(line);
      S.sing(tl, her, [...b1.words, ...b3.words]);
      S.sing(tl, him, [...b2.words, ...b4.words]);

      // "What app is that?": she leans over to look.
      tl.to(her.el, { x: "-=70", rotation: -9, transformOrigin: "50% 90%", duration: 0.3, ease: "back.out(1.8)" }, b1.start - 0.2);
      tl.to(her.eyes, { x: -9, y: 6, duration: 0.15 }, b1.start - 0.1);
      tl.to(her.armL, { rotation: 78, duration: 0.2, ease: "back.out(2)" }, w("app"));
      S.bubble(sc, cam, b1, 1080, 150, { side: "left", color: "#ffe3ec", until: b3.start - 0.25 });

      // "Oh I'm vibescrolling, girl": he doesn't look up until the last word.
      tl.to(him.head, { rotation: 8, duration: 0.2 }, b2.start);
      tl.to(him.eyes, { y: 0, x: 8, duration: 0.15 }, w("girl") - 0.1);
      tl.set(him.eyeR, { opacity: 0 }, w("girl"));
      tl.set(him.wink, { opacity: 1 }, w("girl"));
      tl.set(him.eyeR, { opacity: 1 }, w("girl") + 0.3);
      tl.set(him.wink, { opacity: 0 }, w("girl") + 0.3);
      S.bubble(sc, cam, b2, 150, 150, { side: "right", until: b4.start - 0.12 });
      S.thumbing(tl, phone, him, w("vibescrolling"), w("girl"));

      // "Dawg, vibescrolling?": she sits back up.
      tl.to(her.el, { x: "+=70", rotation: 5, duration: 0.25, ease: "back.out(2)" }, b3.start - 0.1);
      tl.to(her.armL, { rotation: 0, duration: 0.2 }, b3.start - 0.1);
      tl.to(her.eyes, { x: -8, y: 0, duration: 0.12 }, b3.start);
      tl.to(her.head, { rotation: -14, duration: 0.2, ease: "back.out(2)" }, w("vibescrolling", { nth: 1 }));
      tl.to([her.armL, her.armR], { rotation: (i) => (i ? -70 : 70), duration: 0.2, ease: "back.out(2)" }, w("vibescrolling", { nth: 1 }));
      S.bubble(sc, cam, b3, 1130, 150, { side: "left", color: "#ffe3ec", until: sc.bar(19) + 0.2 });

      // "I'm not a dog, I'm a": he takes it badly.
      tl.to(him.head, { rotation: 0, duration: 0.12 }, b4.start);
      tl.to(him.eyes, { x: 8, y: 0, duration: 0.1 }, b4.start);
      tl.to(him.brows, { opacity: 1, duration: 0.06 }, b4.start);
      tl.to(phone.el, { y: "+=260", rotation: 30, duration: 0.3, ease: "power2.in" }, b4.start);
      tl.to([him.armL, him.armR], { rotation: (i) => (i ? -24 : 24), duration: 0.15 }, b4.start);
      tl.fromTo([him.earL, him.earR], { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "elastic.out(1, 0.4)", immediateRender: false }, w("dog"));
      S.hop(tl, him.el, w("dog") - 0.1, { height: 34, dur: 0.22 });
      S.bubble(sc, cam, b4, 250, 150, { side: "right", until: sc.bar(19) + 0.25 });

      // The bar with no words: the camera closes on him in four beats while he fills his lungs.
      const HEAD = { x: HX, y: SEAT - 408 * 1.3 + 150 * 1.3 };
      gsap.set(cam, { transformOrigin: `${HEAD.x}px ${HEAD.y}px` });
      const steps = [1.3, 1.75, 2.3, 3.0];
      sc.beats.filter((b) => b.bar === 19).forEach((b, i) => {
        tl.to(cam, { scale: steps[i], duration: 0.3, ease: "back.out(2.4)" }, b.t);
        tl.to(glow, { opacity: 0.25 * (i + 1), duration: 0.2 }, b.t);
        tl.to(him.torso, { scaleX: 1 + 0.07 * (i + 1), scaleY: 1 + 0.03 * (i + 1), svgOrigin: "150 392", duration: 0.25, ease: "back.out(2)" }, b.t);
        tl.to(him.head, { rotation: -4 * (i + 1), y: -5 * (i + 1), duration: 0.25, ease: "back.out(2)" }, b.t);
      });
      tl.to(him.eyes, { x: 0, duration: 0.1 }, sc.bar(19));
      tl.to(her.eyes, { scale: 1.25, duration: 0.2 }, sc.bar(19) + 0.667);
      tl.to(her.el, { x: "+=60", rotation: 12, duration: 0.3 }, sc.bar(19) + 0.667);
      const last = sc.beat(79);
      tl.set(him.smile, { opacity: 0 }, last);
      tl.set(him.open, { opacity: 1 }, last);
      tl.fromTo(him.open, { scaleY: 0.3 }, { scaleY: 1.5, scaleX: 1.2, duration: 0.5, ease: "power2.out", immediateRender: false }, last);
      for (let t = last, i = 0; t < sc.dur; t += 0.05, i++) tl.set(cam, { x: i % 2 ? 7 : -7 }, t);
      S.flash(tl, stage, sc.dur - 0.09, 0.9);

      S.karaoke(sc);
      window.__timelines["break"] = tl;
    })();
  </script>
</template>
