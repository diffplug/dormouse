<template>
  <style>#root{position:absolute;inset:0} #juggle-stage{background:var(--sun)}</style>
  <div id="root" data-composition-id="juggle" data-width="1920" data-height="1080">
    <div id="juggle-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const sc = S.begin("juggle"); const { tl, stage, w } = sc;
      S.dots(stage, 9, "#f8d679");
      // "Multitask more": a wheel of panes turns behind the mouse, and fills up as it sings.
      const wheel = S.html(stage, `<div class="abs" style="width:0;height:0" data-layout-ignore></div>`);
      gsap.set(wheel, { x: 960, y: 480 });
      const N = 8, R = 400;
      const titles = ["agent", "tests", "dev", "git", "logs", "agent", "build", "docs"], colors = [S.TEAL, S.PINK, S.BLUE, S.CREAM, S.TEAL, S.PINK, S.BLUE, S.CREAM];
      const panes = titles.map((title, i) => {
        const p = S.pane(wheel, { w: 250, h: 170, title, color: colors[i], rows: 5, seed: 40 + i });
        const a = (i / N) * Math.PI * 2 - Math.PI / 2;
        gsap.set(p, { x: Math.cos(a) * R - 125, y: Math.sin(a) * R - 85, scale: 0, transformOrigin: "50% 50%" });
        return p;
      });
      const spin = (to, dur, t, ease = "none") => { tl.to(wheel, { rotation: to, duration: dur, ease }, t); tl.to(panes, { rotation: -to, duration: dur, ease }, t); };
      spin(70, w("multitask"), 0);
      spin(330, sc.dur - w("multitask"), w("multitask"), "power1.in");
      const order = [0, 4, 2, 6, 1, 5, 3, 7];
      const pops = [0.02, 0.35, w("dormouse", { nth: 1 }), w("dormouse", { nth: 1 }) + 0.33, w("multitask"), w("multitask") + 0.3, w("more"), w("more") + 0.12];
      order.forEach((k, i) => tl.to(panes[k], { scale: 1, duration: 0.24, ease: "back.out(2.6)" }, pops[i]));

      S.ground(stage, "#eeb53c");
      const m = S.mouse(stage, { scale: 1.4 });
      S.stand(m, 960);
      S.bop(tl, m, sc.beats, { amp: 1.3 });
      S.dance(tl, m, sc.beats);
      S.sing(tl, m, S.wordsOf(sc.lines));
      S.hop(tl, m.el, w("multitask") - 0.05, { height: 70, dur: 0.3 });
      S.hop(tl, m.el, w("more") - 0.05, { height: 110, dur: 0.34 });
      S.ringAt(tl, stage, 960, 480, w("more"), { size: 2000, color: S.CREAM, dur: 0.6 });
      S.flash(tl, stage, 0.001, 0.7);

      S.karaoke(sc);
      window.__timelines["juggle"] = tl;
    })();
  </script>
</template>
