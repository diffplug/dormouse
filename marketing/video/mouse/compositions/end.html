<template>
  <style>#root{position:absolute;inset:0}</style>
  <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
    <div id="end-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const sc = S.begin("end"); const { tl, stage, w, line } = sc;
      const CUT = sc.bar(25);

      // The end card, which the close-up slides away from: the logo's tile, the mouse in the logo's pose, and where to get it.
      const card = S.html(stage, `<div class="abs" style="width:1920px;height:1080px;background:var(--paper)" data-layout-ignore></div>`);
      S.dots(card, 3);
      const tile = S.tile(card, { scale: 1.5 });
      gsap.set(tile.el, { x: 210, y: 286, transformOrigin: "50% 100%" });
      S.ground(card);
      const name = S.html(card, `<div class="abs mono" style="font-size:128px;line-height:1;color:var(--ink);text-shadow:7px 7px 0 var(--fur)">dormouse.sh</div>`);
      gsap.set(name, { x: 980, y: 370, scale: 0, transformOrigin: "50% 50%" });
      const line2 = S.html(card, `<div class="abs" style="font:600 58px/1 Fredoka,sans-serif;color:var(--ink)">Multitasking terminal for mice</div>`);
      gsap.set(line2, { x: 990, y: 545, opacity: 0 });
      const m = S.mouse(card, { scale: 1.36 });
      S.stand(m, 2250, 878);
      const [o1, o2, o3, o4] = ["out1", "out2", "out3", "out4"].map(line);
      S.bop(tl, m, sc.beats, { amp: 0.9, from: o1.start + 0.3 });
      S.sing(tl, m, [o1, o2, o3, o4].flatMap((l) => l.words));
      sc.beats.filter((b) => b.t > CUT).forEach((b) => {
        tl.fromTo(tile.el, { scaleY: 0.97, scaleX: 1.015 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, b.t);
        tl.set(tile.us, { opacity: 0 }, b.t + 0.333);
        tl.set(tile.us, { opacity: 1 }, b.t + 0.6);
      });
      // "Dormouse": it lands beside the tile.
      S.leap(tl, m, o1.start - 0.4, 730, 878, { rise: 260, dur: 0.4 });
      S.ringAt(tl, card, 730, 860, o1.start, { size: 800 });
      tl.fromTo(tile.el, { rotation: -3 }, { rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.35)", immediateRender: false }, o1.start);
      // "Dormouse": a hand on the prompt, as in the logo.
      tl.to(m.armL, { rotation: 132, duration: 0.22, ease: "back.out(2.4)" }, o2.start);
      tl.to(m.head, { rotation: 7, duration: 0.2 }, o2.start);
      tl.fromTo(tile.gt, { stroke: S.SUN }, { stroke: "#fff", duration: 0.6, immediateRender: false }, o2.start + 0.1);
      S.ringAt(tl, card, 440, 500, o2.start + 0.1, { size: 600 });
      // "Dormouse": the address. "Dormouse": what it is.
      tl.to(name, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, o3.start);
      tl.to(m.armR, { rotation: -96, duration: 0.2, ease: "back.out(2)" }, o3.start);
      tl.to(line2, { opacity: 1, duration: 0.2 }, o4.start);
      tl.fromTo(line2, { y: 585 }, { y: 545, duration: 0.3, ease: "back.out(2)", immediateRender: false }, o4.start);
      tl.to(m.armR, { rotation: -20, duration: 0.3 }, o4.start + 0.3);
      S.ringAt(tl, card, 1400, 480, o4.start, { size: 1500, color: S.FUR });
      S.blink(tl, m, o4.end + 0.3);
      S.blink(tl, m, o4.end + 0.9);

      // First, the close-up: "Do-Dormouse.sh, baby".
      const close = S.html(stage, `<div class="abs" style="width:1920px;height:1080px;background:var(--pink);overflow:hidden" data-layout-ignore></div>`);
      S.dots(close, 44, "#f195b0");
      const him = S.mouse(close, { scale: 2.7, mullet: true });
      gsap.set(him.el, { x: 160, y: 96 });
      gsap.set([him.mulletBack, him.mulletFront], { transformBox: "fill-box" });
      S.bop(tl, him, sc.beats, { amp: 0.7, to: CUT });
      const tag = line("tag");
      S.sing(tl, him, tag.words);
      const term = S.html(close, `<div class="pane" style="width:880px;height:270px"><div class="hd"><i style="background:var(--sun)"></i>zsh</div><div class="bd" style="color:#fff;font-size:98px;line-height:1.5;padding:14px 30px"></div></div>`);
      gsap.set(term, { x: 980, y: 290, rotation: 3, scale: 0, transformOrigin: "50% 50%" });
      tl.to(term, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.05);
      S.type(tl, term.querySelector(".bd"), "$ dormouse.sh", tag.start, tag.words[0].end - 0.5);
      tl.to(him.head, { rotation: 9, duration: 0.3 }, tag.start);
      // "baby": a wink, and the wig comes off for the logo.
      const baby = w("baby");
      tl.set(him.eyeR, { opacity: 0 }, baby);
      tl.set(him.wink, { opacity: 1 }, baby);
      const star = S.html(close, `<svg class="prop" width="140" height="140" viewBox="-70 -70 140 140"><path d="M0 -64 L14 -14 L64 0 L14 14 L0 64 L-14 14 L-64 0 L-14 -14 Z" fill="${S.SUN}" ${S.L}/></svg>`);
      gsap.set(star, { x: 690, y: 330, scale: 0, transformOrigin: "50% 50%" });
      tl.to(star, { scale: 1, rotation: 90, duration: 0.25, ease: "back.out(3)" }, baby + 0.02);
      tl.to(star, { scale: 0, duration: 0.15 }, baby + 0.32);
      tl.to([him.mulletBack, him.mulletFront], { y: -520, x: 240, rotation: 50, duration: 0.4, ease: "power2.in" }, baby + 0.1);
      S.ringAt(tl, close, 560, 430, baby, { size: 1400, color: S.CREAM });
      tl.to(close, { x: -1930, duration: 0.3, ease: "power3.in" }, CUT - 0.22);

      S.karaoke(sc);
      window.__timelines["end"] = tl;
    })();
  </script>
</template>
