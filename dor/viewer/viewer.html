<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DOR_PDF_TITLE__</title>
<link rel="stylesheet" href="./pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="./pdfjs/viewer.css">
</head>
<body data-document="__DOR_PDF_DOCUMENT__">
<header aria-label="PDF controls">
<button id="previous" aria-label="Previous page" disabled>Previous</button>
<label>Page <input id="page-number" type="number" min="1" value="1" aria-label="Page number" disabled></label>
<span id="page-count">of —</span>
<button id="next" aria-label="Next page" disabled>Next</button>
<button id="zoom-out" aria-label="Zoom out" disabled>−</button>
<button id="fit" disabled>Fit width</button>
<button id="zoom-in" aria-label="Zoom in" disabled>+</button>
<button id="cancel">Cancel</button>
</header>
<p id="status" role="status" aria-live="polite">Loading PDF…</p>
<form id="password-form" hidden>
<label>Password <input id="password" type="password" autocomplete="off" required></label>
<button type="submit">Open PDF</button>
</form>
<main id="pages" aria-label="PDF document">
<div id="page" hidden><canvas id="canvas" aria-hidden="true"></canvas><div id="text" class="textLayer" role="document" aria-label="Page text"></div></div>
</main>
<script type="module" src="./pdfjs/viewer.mjs"></script>
</body>
</html>
