<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Pre-boot defaults for Kimbie Dark (the default theme); pocket-theme.ts
         re-syncs both to the applied theme at runtime, before first paint.
         #362712 here and in the manifest must change with POCKET_THEME_ID. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#362712" />
    <!-- Installability (docs/specs/pocket-app.md -> Installable web app). iOS
         only grants Web Push to a Home Screen web app; `apple-touch-icon`
         takes precedence over the manifest's `icons`. The manifest's
         `theme_color` is a pre-boot default like the meta tag above; unlike it,
         it is static, because a splash screen is drawn before any script runs. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dormouse" />
    <title>Dormouse Pocket</title>
    <style>
      /* Theme-agnostic viewport plumbing. Colors and fonts come from the shared
         theme system on <body>, which the boot tag paints before first paint
         (POCKET_PAINT_PROFILE): `--color-app-*` (src/theme-colors.css) once
         the stylesheet loads, which in dev arrives only with the bundle, and
         their theme source until then. <html> cannot read body's variables,
         so it keeps Kimbie Dark's literals behind the body. */
      html,
      body {
        height: 100%;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        background: var(--color-app-bg, #362712);
        color: var(--color-app-fg, #d3af86);
      }
      body {
        background: var(--color-app-bg, var(--vscode-sideBar-background, #362712));
        color: var(--color-app-fg, var(--vscode-sideBar-foreground, #d3af86));
      }
      #pocket-root {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="pocket-root"></div>
    <script type="module" src="../src/remote/pocket-app/main.tsx"></script>
  </body>
</html>
