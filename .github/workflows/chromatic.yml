name: Chromatic

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'docs/stories/**'
      # The lockfile is the root's, so an in-range bump of a rendering dependency
      # reaches the stories while matching neither glob above. Here it refreshes
      # the baseline against the commit that moved the dependency, so the pixel
      # change is attributed there rather than surfacing inside the next
      # unrelated `lib/**` PR and being accepted as that PR's. Deliberately not
      # on `pull_request`: a dependency change is global, so TurboSnap cannot
      # narrow it and every dependency PR would bill a full run.
      - 'pnpm-lock.yaml'
      # `lib/.storybook/main.ts` aliases these three to source, putting them in the
      # story dependency graph exactly as `lib/src` is: `Wall` reaches all three,
      # and `PocketWall.stories.tsx` imports `remote-lib-common` directly. Push-only
      # for the reason above; they nearly always change alongside `lib/**`, so the
      # marginal build count is close to zero.
      - 'dor/**'
      - 'remote-lib-common/**'
      - 'dor-lib-common/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/**'
      - 'docs/stories/**'
  # Manual rebaseline. No glob catches every rendering input, and a commit editing
  # these globs — this file — matches none of them, so without a dispatch the only
  # way to refresh main's baseline is to wait for an unrelated qualifying commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One in-flight build per PR, so a superseded push stops burning runner time.
  # Whether it also stops the snapshot bill depends on the CLI cancelling the build
  # server-side after upload, which is unverified. Keyed by SHA on push so main
  # never cancels — those builds establish the baselines every PR diffs against.
  group: chromatic-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    name: Visual Regression Tests
    # A draft PR does not spend snapshots: marking it ready is the deliberate
    # trigger. A skipped job reports success, but GitHub refuses to merge a draft at
    # all, so for that clause the draft state is itself the gate.
    # Fork PRs are skipped because secrets are withheld from them: the token would be
    # empty and the action would fail red having captured nothing. That clause has no
    # such backstop — if this check is ever made required, a fork PR touching `lib/**`
    # merges with it green rather than blocking as it does today.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        # Frozen, like every other workflow: a bare `pnpm install` resolves
        # afresh, so the lockfile stops pinning what actually runs — in a job
        # that holds CHROMATIC_PROJECT_TOKEN. Not `minimumReleaseAge`, which is
        # applied during resolution and so binds a fresh resolve too; the
        # lockfile pin is the whole of what freezing buys.
        run: pnpm install --frozen-lockfile
        working-directory: lib

      - name: Run Chromatic
        uses: chromaui/action@e10900ba92350acd7561744d2d86224c2a3fbb84 # v18.9.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: lib
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          onlyChanged: true
