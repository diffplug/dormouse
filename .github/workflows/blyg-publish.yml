name: Publish Dormouse Blyg

on:
  # Not `release: published`: a release is published before its release PR
  # brings the CHANGELOG.md entry to main, so that run could only fail. The
  # push of that entry to main publishes it.
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blyg-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'diffplug/dormouse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: blyg-publish
    steps:
      # Always use reviewed main for publisher code and the canonical
      # changelog, including later corrections.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: node --test scripts/publish-blyg.test.mjs
      - name: Publish and pin released changelog entries
        run: node scripts/publish-blyg.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          BLYG_API_TOKEN: ${{ secrets.BLYG_API_TOKEN }}
