name: security-audit

# Audits this repo against SECURITY.md. Runs nightly via the schedule
# trigger and on-demand via workflow_dispatch. release.yml dispatches it
# on the release tag and gates publishing on the result — it dispatches
# rather than calling this workflow with `uses:` because a tag `push`
# would propagate as event_name `push`, which claude-code-action rejects.

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The AUDIT_PAT (read-only Administration + Secrets + Environments)
    # lives in this environment, whose deployment-branch-policy admits
    # only `main` and `v*` tags — refs that the §3 rulesets reserve to
    # admins. A bot-pushed feature branch cannot reach this job at all
    # (GitHub rejects the run before any step starts), so the PAT
    # cannot be exfiltrated through a hand-authored workflow on a
    # non-admin-gated ref.
    environment:
      name: security-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify AUDIT_PAT is provisioned
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
        run: |
          [ -n "$AUDIT_PAT" ] && exit 0
          echo "FAIL" > audit-status.txt
          echo "**FAIL** — \`AUDIT_PAT\` is not present in the \`security-audit\` environment. See [SECURITY.md > CI Validation Contract](https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md#ci-validation-contract) for provisioning." > audit-report.md
          echo "::error::AUDIT_PAT secret is not set."
          exit 1

      # One audit, three subagents with disjoint scopes. The domains are
      # genuinely different subject matters — dependency provenance, CI
      # and secret placement, and the product's own remote-control trust
      # model — and a single agent holding all three loses the thread on
      # each. Application security suffers worst: it is the newest
      # section, the one with the most code behind it, and the easiest to
      # crowd out with `gh api` output. Splitting it into its own context
      # also means that agent needs no admin PAT at all — it reads code
      # and specs, nothing else.
      #
      # Each subagent writes its own report fragment before returning, so
      # a run that dies in the orchestrator still leaves evidence in the
      # transcript artifact rather than nothing.
      - name: Audit against SECURITY.md
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1
        env:
          # `claude-code-action` resets `GH_TOKEN` to its own internal
          # workflow token, so setting `GH_TOKEN` at this scope is
          # silently overridden. Expose AUDIT_PAT under its own name
          # and have the prompt instruct Claude to prefix `gh api`
          # calls with `GH_TOKEN=$AUDIT_PAT`.
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # release.yml dispatches this workflow with the default
          # GITHUB_TOKEN, so the actor is `github-actions[bot]`. The
          # action refuses bot-initiated runs unless the bot is allow-
          # listed. This is safe here: the prompt below is hardcoded (no
          # comment/PR/issue injection vector) and the job only runs on
          # admin-gated refs behind the `security-audit` environment. The
          # nightly `schedule` run has a human actor and is unaffected.
          allowed_bots: "github-actions"
          # Without an explicit allowlist the action defaults to a
          # restrictive set that excludes Bash and Write, so an
          # auditing prompt that wants to run `gh api` and produce a
          # report file racks up permission denials and exits without
          # writing audit-status.txt. `Task` is what lets the
          # orchestrator fan out to the three domain subagents.
          claude_args: '--allowed-tools "Read,Write,Edit,Bash,Grep,Glob,Task"'
          prompt: |
            You are the orchestrator of this repository's nightly
            security audit. SECURITY.md is the document you audit
            against: its `FAIL IF` lines are concrete mechanical checks,
            and it also says that list is not exhaustive, so each
            domain gets a qualitative pass too.

            Audit nothing yourself. Fan the work out to three subagents
            with disjoint scopes, then merge what they return. Spawn all
            three with the Task tool in a SINGLE message so they run
            concurrently.

            Give each subagent its whole prompt below verbatim, plus
            this preamble:

              Read SECURITY.md first. Your scope is exactly the sections
              named below — ignore every other section, including its
              `FAIL IF` lines; another agent owns them. For each `FAIL
              IF` in your scope, run the mechanical check (`gh api`,
              grep, file read, or a script) and record PASS or FAIL with
              concrete evidence: file path and line number, API response
              excerpt, or command output. A `FAIL IF` bullet may assert
              several properties in one sentence; each clause gets its
              own verdict and its own evidence. Never satisfy a bullet
              in bulk.

              Then do the qualitative pass described for your domain,
              rating findings BLOCKER / WARNING / INFO. Report what you
              can prove. Reserve `UNVERIFIABLE` for genuinely
              indeterminable cases (a transient network error, say) and
              explain why.

              Write your findings to the file named in your prompt, with
              two sections: `### FAIL IF results` (one line per check)
              and `### Qualitative findings` (severity-tagged). Write
              that file BEFORE you return. Then return a single line:
              `PASS` or `FAIL`, followed by a one-sentence rationale.
              FAIL if any `FAIL IF` in your scope is violated or any of
              your qualitative findings is BLOCKER.

              Never print a secret value. `$AUDIT_PAT` is passed only as
              an unexpanded `GH_TOKEN=` prefix; do not echo it, do not
              run `printenv` or `set -x`, and do not paste the contents
              of any credential file into your report — report its mode
              and location instead. This repository is public and both
              your report and the SDK transcript are world-readable.

            --- Subagent 1 -----------------------------------------
            description: supply-chain audit
            Scope: the `## Dependency Supply Chain` section only.
            Output file: `audit-supply-chain.md`.

            You will need `pnpm install --frozen-lockfile` before the
            generate-deps check; the workspace is already installed by
            an earlier workflow step, so try the check first.

            Qualitative pass: newly added or upgraded runtime
            dependencies since the last audit, anything in the lockfile
            that resolves outside the registry, install scripts in
            production dependencies, and any package a user runs that
            is reachable but not disclosed.

            --- Subagent 2 -----------------------------------------
            description: CI and secrets audit
            Scope: the `## GitHub Actions Policies`, `## Automated
            Maintainer (tend)`, `## VS Code Extension Releases`,
            `## Desktop Releases`, `## Reporting a Vulnerability`, and
            `## CI Validation Contract` sections.
            Output file: `audit-ci-secrets.md`.

            The default `$GH_TOKEN` in this environment is a workflow
            `GITHUB_TOKEN` and does NOT have admin scope. For checks
            that need admin access (ruleset bypass actors, repo or
            environment secret listings, environment policy details,
            private vulnerability reporting) prefix `gh api` with
            `GH_TOKEN=$AUDIT_PAT`. Example:

              GH_TOKEN=$AUDIT_PAT gh api repos/$GITHUB_REPOSITORY/rulesets/16757376

            `$AUDIT_PAT` is a fine-grained, read-only PAT covering
            Administration + Secrets + Environments, guaranteed present
            by an earlier step. If a prefixed call still returns 403,
            record FAIL with the note "PAT scope drifted from
            SECURITY.md".

            Qualitative pass: `.github/workflows/`, `.config/tend.yaml`,
            `.github/renovate.json`, `scripts/`, and any code that
            touches secrets.

            --- Subagent 3 -----------------------------------------
            description: application security audit
            Scope: the `## Remote Control` section only.
            Output file: `audit-application.md`.

            This is a code-and-specs audit of the product's own remote
            control stack. You need no GitHub API access and no PAT —
            do not use one.

            Read, at minimum: `docs/specs/remote-security-model.md`,
            `docs/specs/server.md`, `docs/specs/remote-api.md`,
            `SELF_HOST.md`, and then the code they point at —
            `server-lib-common/src/security/`, `server/src/`,
            `lib/src/remote/host/`, `lib/src/remote/client/`,
            `lib/src/host/remote/`, `vscode-ext/src/remote-host*.ts`,
            `scripts/csp-defaults.mjs`, and
            `deploy/local/install-macos.sh`.

            Qualitative pass — be adversarial, and go past the `FAIL IF`
            list. Ask specifically:

            * Can anything reach a Host's ACL without a human approving
              on that Host? Trace every writer, including migration and
              adopt paths, and including what a compromised webview or a
              compromised Server could send.
            * Can a credential (`hostToken`, setup password, VAPID
              private key, session token, device key) reach a process,
              a file mode, a log line, or a wire frame it should not?
            * Does any check that the Server performs stand in for one
              the Host must perform itself?
            * Are challenges single-use, TTL-bounded, and
              domain-separated, and can a signature captured in one
              protocol context be replayed in another?
            * Where does untrusted input enter — relay frames, push
              endpoints, terminal bytes, notification text, state files
              read back from disk — and what happens on a malformed,
              oversized, or hostile value?
            * Does the shipped code still match what the specs and this
              section claim? Spec drift is a finding; say which side is
              wrong.

            Where the section says a risk is accepted (the setup
            password's hardening) or a gap is known (revocation, the
            audit trail), do not re-report it as a finding — report only
            if the situation has changed or is worse than described.

            --------------------------------------------------------

            When all three have returned:

            1. Assemble the report with Bash, not by retyping their
               content:

                 { echo "# Security audit"; echo;
                   echo "## Supply chain"; echo; cat audit-supply-chain.md; echo;
                   echo "## CI and secrets"; echo; cat audit-ci-secrets.md; echo;
                   echo "## Application security"; echo; cat audit-application.md;
                 } > audit-report.md

               If a subagent left no file, say so in its place in the
               report — an empty domain is itself a finding about the
               audit, and must not be silently omitted.
            2. Append a `## Summary` section: overall PASS or FAIL, a
               one-paragraph rationale, and one line per domain giving
               that domain's verdict.
            3. Write `PASS` or `FAIL` (no other text) to
               `audit-status.txt`. Status is FAIL if any subagent
               returned FAIL.

            Write `audit-report.md` before `audit-status.txt`, so a
            session that dies mid-write leaves the evidence rather than
            a bare verdict. Do not call `exit` — the workflow inspects
            the status file.

      # The SDK transcript is the only record of what the audit actually
      # did. `claude-code-action` keeps it out of the logs on purpose
      # (`show_full_output` stays off so tool output cannot leak into a
      # public log), and the runner is ephemeral — so without this upload
      # a run that finishes without writing a verdict is undiagnosable
      # after the fact, which is exactly the failure this archive exists
      # to explain. Uploaded unconditionally: a PASS transcript is the
      # baseline you compare a bad one against.
      #
      # This repo is public, so the artifact is world-readable. That is
      # consistent with the audit reports already posted to public
      # issues. It is NOT consistent with log masking: `***` redaction
      # applies to step logs, not to artifact contents, and the SDK
      # serializes every message into this file — Bash `tool_result`
      # bodies included — so raw tool output ships verbatim.
      #
      # The prompt only passes `$AUDIT_PAT` through an unexpanded
      # `GH_TOKEN=` prefix and `gh api` never returns secret values, but
      # that is a convention, not a control: the agent holds unrestricted
      # Bash and is asked to audit code that touches secrets, so one
      # `printenv` or one `set -x` would publish an admin-read PAT for
      # the artifact's whole retention. The step below strips the values
      # verbatim first. That does not stop an agent that encodes a
      # secret, but it closes the accidental-print path, which is the
      # one that actually happens.
      # Both sinks, not just the archive. `audit-report.md` is `cat` into a
      # public issue, which outlives the artifact's 14 days, is indexed, and
      # is emailed to subscribers — and the prompt asks for evidence as
      # "API response excerpt, or command output", so it invites exactly the
      # paste this guards against.
      #
      # Fail closed. `Archive audit transcript` below is `if: always()` and
      # does not depend on this step's outcome, so a throwing redactor would
      # otherwise ship the raw file: on any error, delete every sink
      # instead. Deleted rather than truncated — `: >` has to open the file
      # and so fails on exactly the unreadable file that made the redactor
      # throw, whereas `rm` needs only the directory. A nonzero count is not routine — it means a secret reached
      # a file in cleartext — so it surfaces as an annotation rather than a
      # log line, and the right response is to rotate.
      - name: Redact secrets from agent output
        if: always()
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TRANSCRIPT="$RUNNER_TEMP/claude-execution-output.json"
          node -e '
            const fs = require("fs");
            let hits = 0;
            for (const p of process.argv.slice(1)) {
              if (!fs.existsSync(p)) continue;
              let s = fs.readFileSync(p, "utf8");
              for (const name of ["AUDIT_PAT", "CLAUDE_CODE_OAUTH_TOKEN"]) {
                const v = process.env[name];
                // Guard against a short or empty value turning into a
                // global replace of something innocuous.
                if (!v || v.length < 8) continue;
                const parts = s.split(v);
                hits += parts.length - 1;
                s = parts.join("***");
              }
              fs.writeFileSync(p, s);
            }
            if (hits > 0) {
              console.log("::warning::Redacted " + hits + " literal secret occurrence(s) from agent output. A secret reached a file in cleartext — rotate AUDIT_PAT and CLAUDE_CODE_OAUTH_TOKEN.");
            } else {
              console.log("No literal secret occurrences found.");
            }
          ' "$TRANSCRIPT" audit-report.md \
            audit-supply-chain.md audit-ci-secrets.md audit-application.md \
            || { rm -f "$TRANSCRIPT" audit-report.md \
                   audit-supply-chain.md audit-ci-secrets.md audit-application.md; exit 1; }

      - name: Archive audit transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-transcript
          # The per-domain fragments are uploaded too. Each subagent writes
          # its own before returning, so a run that dies in the orchestrator
          # — the INCONCLUSIVE shape this archive exists to explain — still
          # ships whatever the domains actually found, instead of only a
          # transcript someone has to reconstruct them from.
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            audit-supply-chain.md
            audit-ci-secrets.md
            audit-application.md
          retention-days: 14
          if-no-files-found: warn

      - name: Surface result, file or close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          # Three outcomes, not two. PASS and FAIL are verdicts the audit
          # reached; MISSING means it never reached one — the agent ended
          # its turn without writing the status file (observed on runs
          # 31927560706 and 32100728239, both of which reported SDK
          # success and simply never called Write). Collapsing MISSING
          # into FAIL, as this step used to, files an identical issue for
          # "the repo is insecure" and "the auditor stopped early",
          # leaving no way to tell a real finding from a no-op run.
          #
          # MISSING still exits non-zero and still files under
          # `security-audit-failure`: an audit that produced no verdict
          # must not let the release gate in `release.yml` pass, and a
          # later PASS should auto-close it like any other failure.
          if [ -s audit-status.txt ]; then
            STATUS=$(tr -d '[:space:]' < audit-status.txt)
          fi
          case "${STATUS:-}" in
            PASS|FAIL) ;;
            *) STATUS=MISSING ;;
          esac

          DATE=$(date -u +%Y-%m-%dT%H:%MZ)
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Idempotent label creation; ignore "already exists" errors.
          gh label create security-audit-failure \
            --color B60205 --description "Security audit failure" 2>/dev/null || true

          if [ "$STATUS" = "PASS" ]; then
            # Auto-close any open audit-failure issues so the issue
            # tracker reflects the live state.
            for n in $(gh issue list --label security-audit-failure \
                         --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Audit passed at $DATE. [Run]($RUN_URL)"
            done
            echo "Audit passed."
            exit 0
          fi

          # Deep-link the transcript so the issue points at the evidence
          # rather than at a run page the reader has to dig through. The
          # id lookup needs `actions: read`, which this job holds. Left
          # empty when there is no artifact — a run cancelled on
          # `timeout-minutes` never writes the execution file, and those
          # are exactly the runs a link to the run page would dead-end on,
          # so both consumers below are gated rather than falling back.
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                     --jq '.artifacts[] | select(.name == "audit-transcript") | .id' \
                     2>/dev/null | head -n1 || true)
          if [ -n "$ART_ID" ]; then
            TRANSCRIPT_URL="$RUN_URL/artifacts/$ART_ID"
          else
            TRANSCRIPT_URL=""
          fi

          if [ "$STATUS" = "MISSING" ]; then
            TITLE="[security-audit] INCONCLUSIVE on $(date -u +%Y-%m-%d)"
            {
              echo "Audit produced no verdict at $DATE. [Run]($RUN_URL)"
              echo
              echo "The audit step exited without writing \`audit-status.txt\`."
              if [ -s audit-report.md ]; then
                echo "It did leave a partial \`audit-report.md\`, reproduced below,"
                echo "which may itself contain a real finding — read it first. The"
                echo "prompt writes the report before the status file, so a report"
                echo "without a verdict is the expected shape of a session that died"
                echo "mid-write."
              else
                echo "**This is not a security finding** — the audit did not reach"
                echo "one. Treat it as a failed audit run, not a failed audit."
              fi
              if [ -n "$TRANSCRIPT_URL" ]; then
                echo
                echo "[Download the transcript]($TRANSCRIPT_URL) to see where it stopped."
              fi
              if [ -s audit-report.md ]; then
                echo
                echo "---"
                echo
                cat audit-report.md
              fi
            } > audit-comment.md
          else
            TITLE="[security-audit] FAIL on $(date -u +%Y-%m-%d)"
            if [ ! -s audit-report.md ]; then
              printf '%s\n' \
                "Audit reported FAIL but wrote no \`audit-report.md\`." \
                > audit-report.md
            fi
            {
              LINKS="[Run]($RUN_URL)"
              [ -n "$TRANSCRIPT_URL" ] && LINKS="$LINKS · [Transcript]($TRANSCRIPT_URL)"
              echo "Audit failed at $DATE. $LINKS"
              echo
              cat audit-report.md
            } > audit-comment.md
          fi

          EXISTING=$(gh issue list --label security-audit-failure \
                       --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file audit-comment.md
            # Upward only. FAIL is the ceiling: an inconclusive run must not
            # relabel an issue that already carries real findings, and the
            # title never needs walking back down because a PASS closes the
            # issue outright.
            if [ "$STATUS" = "FAIL" ]; then
              gh issue edit "$EXISTING" --title "$TITLE"
            fi
            echo "Appended $STATUS to issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label security-audit-failure \
              --body-file audit-comment.md
          fi
          exit 1
