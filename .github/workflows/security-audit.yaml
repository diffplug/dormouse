name: security-audit

# Audits this repo against the security specs (docs/specs/security*.md). Runs nightly via the schedule
# trigger and on-demand via workflow_dispatch. release.yml dispatches it
# on the release tag and gates publishing on the result — it dispatches
# rather than calling this workflow with `uses:` because a tag `push`
# would propagate as event_name `push`, which claude-code-action rejects.

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # The four per-domain fragment filenames, then the deterministic
      # GitHub-state check's, in one place. They are
      # named by the redactor's argv, its fail-closed `rm -f`, the
      # encrypted archive, the reporting step's guard loop, and the public
      # body builder, and drift between two of those lists is precisely
      # what the `FAIL IF` on the redactor exists to catch — a sink that
      # stops being redacted but keeps being published. Every use
      # word-splits this deliberately, so the names must stay
      # space-separated and shell-safe.
      AUDIT_FRAGMENTS: audit-supply-chain.md audit-ci-secrets.md audit-application.md audit-hosted.md audit-github-state.md
    # Must stay well above the orchestrator's own wait deadline in
    # `.github/audit/orchestrator.md` (32 minutes, counted from the first
    # time its wait loop runs — i.e. after checkout, setup-node, the
    # install, and the spawn — and persisted across the loop's
    # re-issues so it accumulates rather than restarting).
    # At 20 minutes the runner cancelled the job before that deadline
    # could ever fire, so the graceful "give up and report what the
    # domains found" path was unreachable and every overrun landed as
    # INCONCLUSIVE — the exact failure mode the deadline exists to
    # prevent. The slack also covers the merge, verdict, redact, upload,
    # and reporting steps that run after the wait.
    timeout-minutes: 40
    # The AUDIT_PAT (read-only Administration + Secrets + Environments)
    # lives in this environment, whose deployment-branch-policy admits
    # only `main` and `v*` tags — refs that the §3 rulesets reserve to
    # admins. A bot-pushed feature branch cannot reach this job at all
    # (GitHub rejects the run before any step starts), so the PAT
    # cannot be exfiltrated through a hand-authored workflow on a
    # non-admin-gated ref.
    environment:
      name: security-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify AUDIT_PAT is provisioned
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
        run: |
          [ -n "$AUDIT_PAT" ] && exit 0
          echo "**FAIL** — \`AUDIT_PAT\` is not present in the \`security-audit\` environment. See [security-audit.md > Environment and AUDIT_PAT](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/specs/security-audit.md#environment-and-audit_pat) for provisioning." > audit-report.md
          echo "FAIL" > audit-status.txt
          echo "::error::AUDIT_PAT secret is not set."
          exit 1

      # The deterministic half: every `FAIL IF` that GitHub state answers,
      # read live and judged by a script against
      # `.github/audit/expected-github-state.json` rather than re-derived by
      # a model each night (docs/specs/security-audit.md -> "Deterministic
      # checks"). Its fragment rides `AUDIT_FRAGMENTS` like a domain's, so a
      # FAIL here fails the run through the reporting steps below. It must
      # not stop the domains: a crash leaves no fragment, which the
      # reporting step's guard reports as an unfinished audit.
      - name: Check GitHub state
        id: ghstate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT }}
          # Workflow runs, the tagger App, and the tend tag are public; the
          # workflow token reads them without spending the PAT's scope.
          WORKFLOW_TOKEN: ${{ github.token }}
        run: node scripts/github-state-check.mjs --out audit-github-state.md

      # A scheduled run whose commit and GitHub-state hash both match the last
      # completed run on `main`, which passed, skips the model-run domains
      # (docs/specs/security-audit.md -> "Skipping an unchanged audit"). A
      # dispatch, the release gate's included, never skips. A crash here
      # leaves `skip` unset, which runs the domains.
      - name: Skip the domains if nothing changed
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_HASH: ${{ steps.ghstate.outputs.hash }}
        run: node scripts/security-audit-plan.mjs

      # What this run audited, for the next run's skip decision: the commit,
      # the state hash, and when the domains last ran. Public like every
      # artifact here, and it carries nothing a finding could.
      - name: Upload the audited state
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-state
          path: ${{ runner.temp }}/audit-state/audit-state.json
          retention-days: 14
          if-no-files-found: error

      # The open findings ledger, as the checklist each domain re-verifies
      # before it passes a rule one cites (docs/specs/security-audit.md ->
      # "Findings ledger"). The second step that holds `EMBARGO_TOKEN`, and
      # like the first it runs only `gh` and shell builtins. It writes the
      # open ledger titles, keys and summaries alone, to
      # `audit-open-findings.txt` for the agent to read, and logs only their
      # count, which the public issue already carries. A failure writes no
      # file, and every domain then computes INCONCLUSIVE.
      - name: List open findings
        if: steps.plan.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EMBARGO_TOKEN }}
          EMBARGO_REPO: diffplug/dormouse-embargo
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] ||
            { echo "::error::EMBARGO_TOKEN is not set; the domains have no open findings to re-verify."; exit 1; }
          GH_CONFIG_DIR="$RUNNER_TEMP/gh-findings-$GITHUB_RUN_ID-$$"
          [ ! -e "$GH_CONFIG_DIR" ] ||
            { echo "::error::A gh configuration directory already exists at the fresh path."; exit 1; }
          export GH_CONFIG_DIR GH_HOST=github.com
          OPEN=$(gh issue list --repo "$EMBARGO_REPO" --state open --limit 1000 \
                   --json number,title \
                   --jq '.[] | select(.title | startswith("[audit-finding ")) | "\(.number) \(.title)"') ||
            { echo "::error::Reading the findings ledger failed; the domains have no open findings to re-verify."; exit 1; }
          COUNT=0
          while read -r row; do
            [ -n "$row" ] || continue
            printf '%s\n' "${row#* }"
            COUNT=$((COUNT + 1))
          done <<< "$OPEN" > audit-open-findings.txt
          echo "$COUNT open finding(s) for the domains to re-verify."

      - name: Audit against the security specs
        if: steps.plan.outputs.skip != 'true'
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        env:
          # `claude-code-action` resets `GH_TOKEN` to its own internal
          # workflow token, so setting `GH_TOKEN` at this scope is
          # silently overridden. Expose AUDIT_PAT under its own name
          # and have the prompt instruct Claude to prefix `gh api`
          # calls with `GH_TOKEN=$AUDIT_PAT`.
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
          # Process-wide: this raises the cap on every Bash call in the
          # session, the four domain subagents' as well as the
          # orchestrator's. What it is for is the orchestrator's wait loop,
          # which breaks itself at 540s so a capped call still prints
          # `STILL WAITING`; at the two-minute default that call is
          # backgrounded before the break can print, leaving no line to act
          # on — the run 34581574869 failure. The prompt asks for
          # `timeout: 600000` per call, and this makes forgetting it
          # harmless rather than fatal. The wider scope is accepted, not
          # incidental: a domain's own long commands (`application-security`
          # re-runs vitest and the repo lints) stop being backgrounded
          # mid-run, and the cost is that a subagent that blocks with no
          # self-break loses ten minutes rather than two.
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # release.yml dispatches this workflow with the default
          # GITHUB_TOKEN, so the actor is `github-actions[bot]`. The
          # action refuses bot-initiated runs unless the bot is allow-
          # listed. This is safe here: the prompt below is hardcoded (no
          # comment/PR/issue injection vector) and the job only runs on
          # admin-gated refs behind the `security-audit` environment. The
          # nightly `schedule` run has a human actor and is unaffected.
          allowed_bots: "github-actions"
          # Without an explicit allowlist the action defaults to a
          # restrictive set that excludes Bash and Write, so an
          # auditing prompt that wants to run `gh api` and produce a
          # report file racks up permission denials and exits without
          # writing audit-status.txt.
          #
          # `--allowed-tools` only auto-approves; it removes nothing. Run
          # 32618922852 proved that the hard way: it passed all 21
          # mechanical checks, handed the qualitative pass to two
          # background subagents, then ended its turn to "wait for the
          # completion notification" — which in a headless SDK run
          # terminates the session, discarding the subagents and leaving
          # both output files unwritten. A clean audit blocked the
          # release gate for $5 and no verdict.
          #
          # The cause was ending the turn, not delegating. `Task` is
          # therefore allowed on purpose — the audit fans out to four
          # scoped domain agents — and the orchestrator prompt carries
          # the rule that makes it safe: block in a Bash `until` loop on
          # the fragment files, never end the turn to wait. `Workflow`
          # stays denied because nothing here should be spawning one.
          # Two of the four domains are mechanical — run a generator, read
          # `gh api`, compare a pin — and the session default (Sonnet)
          # does them well. `application-security` and `hosted` are the
          # ones that read code adversarially, and their findings have
          # been the ones that needed real reasoning: tracing a
          # relay-minted `clientId` to a keystroke-injection path, or
          # working out that an 8-char fingerprint carries ~40 bits
          # because a P-256 point's leading byte is constant. They run on
          # Opus; the orchestrator and the two mechanical domains stay on
          # the cheaper default, so the cost lands only where the depth
          # does.
          #
          # Each agent's prompt is a pointer, not a copy — the content
          # stays in `.github/audit/` so CI and
          # `scripts/security-audit-local.sh` cannot drift apart.
          claude_args: >-
            --model sonnet
            --allowed-tools "Read,Write,Edit,Bash,Grep,Glob,Task,Agent"
            --disallowed-tools "Workflow"
            --agents '{"supply-chain":{"description":"Audits docs/specs/security-supply-chain.md.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/supply-chain.md`, and follow them exactly."},"ci-and-secrets":{"description":"Audits docs/specs/security.md, docs/specs/security-ci.md, and docs/specs/security-audit.md.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/ci-and-secrets.md`, and follow them exactly."},"application-security":{"description":"Audits docs/specs/security-local.md and docs/specs/security-remote.md, and sweeps the rest of the product code.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/application-security.md`, and follow them exactly.","model":"opus"},"hosted":{"description":"Audits docs/specs/security-hosted.md: Hosted accounts and the pgstencil provenance link.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/hosted.md`, and follow them exactly.","model":"opus"}}'
          # The prompts live in `.github/audit/`, not inline here: they
          # are long enough to need real diffs in review, they must be
          # runnable locally against the same text CI uses
          # (`scripts/security-audit-local.sh`), and each domain's scope
          # — the bullet list of security specs under its `**Scope` line
          # — is what `scripts/spec-lint.mjs` (check 16) reads to prove
          # every `docs/specs/security*.md` has exactly one owner. That
          # lint cannot read YAML block scalars, and when the scopes were
          # inline here the ownership check was a grep that wrapping
          # once broke silently.
          prompt: |
            You are the orchestrator of this repository's nightly
            security audit.

            Read `.github/audit/orchestrator.md` and follow it exactly.
            It tells you which subagents to spawn, which prompt files to
            give them, how to wait for them without ending your turn,
            and how to write `audit-report.md` and `audit-status.txt`.

      # Everything the agent wrote leaves the runner by two routes only: an
      # age-encrypted archive (`Encrypt the audit transcript`) and the
      # private embargo issue (`File embargoed findings`). The public issue
      # is built from verdicts and counts and carries none of it. See
      # docs/specs/security-audit.md -> "Embargo".
      #
      # Both routes still get the redactor. The prompt only passes
      # `$AUDIT_PAT` through an unexpanded `GH_TOKEN=` prefix, but that is
      # a convention, not a control: the agent holds unrestricted Bash and
      # audits code that touches secrets, so one `printenv` or one `set -x`
      # lands a PAT in the SDK transcript, which serializes every Bash
      # `tool_result` verbatim. `***` masking applies to step logs, not to
      # files. Stripping the values does not stop an agent that encodes a
      # secret, but it closes the accidental-print path, which is the one
      # that actually happens.
      #
      # Fail closed: on any error, delete every sink instead, so neither
      # route ships the raw file. Deleted rather than truncated — `: >` has
      # to open the file and so fails on exactly the unreadable file that
      # made the redactor throw, whereas `rm` needs only the directory. A
      # nonzero count is not routine — it means a secret reached a file in
      # cleartext — so it surfaces as an annotation rather than a log line,
      # and the right response is to rotate.
      - name: Redact secrets from agent output
        if: always()
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TRANSCRIPT="$RUNNER_TEMP/claude-execution-output.json"
          # Every sink the encrypted archive or the private issue carries
          # has to be in the argument list, and the fail-closed `rm -f` has
          # to delete the same set — docs/specs/security-audit.md names
          # `audit-report.md`, the four per-domain fragments, and the
          # transcript. The fragments are
          # agent output like any other: a subagent that shells out and
          # prints an environment lands the value in its own fragment,
          # not in the merged report. The fragment names come from the
          # job-level `AUDIT_FRAGMENTS` so this list and the guard loop in
          # the reporting step cannot drift; both expansions below are
          # unquoted on purpose (shellcheck SC2086) because the value is a
          # filename list. Keep every shell comment outside the
          # single-quoted script — inside it, Node parses it as
          # JavaScript and the step fails closed on every run, which
          # `bash -n` does not catch.
          # shellcheck disable=SC2086
          node -e '
            const fs = require("fs");
            let hits = 0;
            for (const p of process.argv.slice(1)) {
              if (!fs.existsSync(p)) continue;
              let s = fs.readFileSync(p, "utf8");
              for (const name of ["AUDIT_PAT", "CLAUDE_CODE_OAUTH_TOKEN"]) {
                const v = process.env[name];
                // Guard against a short or empty value turning into a
                // global replace of something innocuous.
                if (!v || v.length < 8) continue;
                const parts = s.split(v);
                hits += parts.length - 1;
                s = parts.join("***");
              }
              fs.writeFileSync(p, s);
            }
            if (hits > 0) {
              console.log("::warning::Redacted " + hits + " literal secret occurrence(s) from agent output. A secret reached a file in cleartext — rotate AUDIT_PAT and CLAUDE_CODE_OAUTH_TOKEN.");
            } else {
              console.log("No literal secret occurrences found.");
            }
          ' "$TRANSCRIPT" audit-report.md $AUDIT_FRAGMENTS \
            || { rm -f "$TRANSCRIPT" audit-report.md $AUDIT_FRAGMENTS; exit 1; }

      # The SDK transcript is the only record of what the audit actually
      # did: `claude-code-action` keeps tool output out of the logs on
      # purpose, and the runner is ephemeral, so a run that finishes
      # without a verdict is undiagnosable without it. The fragments ride
      # along so an orchestrator that dies mid-merge still ships what the
      # domains found. Archived on every outcome — a PASS transcript is the
      # baseline you compare a bad one against.
      #
      # This repository is public and so is every artifact it uploads, so
      # the archive goes up as age ciphertext only, to the maintainer key
      # in `.github/audit/transcript-recipient.txt`. Written to a partial
      # name and renamed once age exits zero, so a failed encryption leaves
      # nothing at the path the upload names, and the upload is gated on
      # this step succeeding as well. `age` comes from the Ubuntu archive
      # the runner image already trusts, as in `hosted-production.yml`.
      - name: Encrypt the audit transcript
        id: encrypt
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/audit-transcript.tar.gz.age"
          rm -f "$OUT" "$OUT.partial"
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          STAGE=$(mktemp -d)
          # Unquoted on purpose: `AUDIT_FRAGMENTS` is a filename list. A sink
          # a domain never wrote is simply absent from the archive.
          # shellcheck disable=SC2086
          for f in "$RUNNER_TEMP/claude-execution-output.json" audit-report.md $AUDIT_FRAGMENTS; do
            if [ -f "$f" ]; then cp "$f" "$STAGE/"; fi
          done
          tar -C "$STAGE" -czf - . |
            age -R .github/audit/transcript-recipient.txt -o "$OUT.partial" ||
            { rm -f "$OUT.partial"; rm -rf "$STAGE"; echo "::error::Encrypting the audit transcript failed; nothing is uploaded."; exit 1; }
          mv "$OUT.partial" "$OUT"
          rm -rf "$STAGE"

      - name: Archive audit transcript
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-transcript
          # Ciphertext only: one `.age` file, never a plaintext sink.
          path: ${{ runner.temp }}/audit-transcript.tar.gz.age
          retention-days: 14
          if-no-files-found: error

      # Decides the verdict and composes the private report and the findings
      # ledger. It files nothing: `File embargoed findings` takes both to the
      # private tracker and `Surface result, file or close issue` files the
      # public issue, each reading what this step hands on in its outputs.
      #
      # The verdict is computed, not read. `scripts/security-audit-report.mjs`
      # derives each domain's verdict from its result and finding lines against
      # the rules its specs carry, and a `VERDICT:` line or `audit-status.txt`
      # that disagrees is reported as an anomaly rather than believed: on
      # 2026-10-07 a fragment said `VERDICT: PASS` over its own `UNVERIFIABLE`
      # line. See docs/specs/security-audit.md -> "Outcomes and reporting".
      - name: Compose the audit report
        id: compose
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # A skipped run has only the deterministic fragment to read.
          AUDIT_FRAGMENTS: ${{ steps.plan.outputs.fragments || env.AUDIT_FRAGMENTS }}
        run: |
          set -o pipefail
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Deep-link the encrypted transcript so the issue points at the
          # evidence rather than at a run page the reader has to dig through.
          # The id lookup needs `actions: read`, which this job holds. Left
          # empty when there is no artifact — a run cancelled on
          # `timeout-minutes` never writes the execution file, and those are
          # exactly the runs a link to the run page would dead-end on.
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                     --jq '.artifacts[] | select(.name == "audit-transcript") | .id' \
                     2>/dev/null | head -n1 || true)
          TRANSCRIPT_URL=""
          [ -n "$ART_ID" ] && TRANSCRIPT_URL="$RUN_URL/artifacts/$ART_ID"

          # The builder writes its outputs to a file of its own, appended only
          # when it succeeds, so a builder that dies half-way can hand on no
          # status but the fail-closed one below.
          OUTPUTS=$(mktemp)
          if node scripts/security-audit-report.mjs compose \
               --run-url "$RUN_URL" --transcript-url "$TRANSCRIPT_URL" --outputs "$OUTPUTS"; then
            cat "$OUTPUTS" >> "$GITHUB_OUTPUT"
            STATUS=$(sed -n 's/^status=//p' "$OUTPUTS")
          else
            echo "::error::The report builder failed; the run is reported INCONCLUSIVE with no detail."
            STATUS=MISSING
            echo "status=MISSING" >> "$GITHUB_OUTPUT"
            rm -rf audit-ledger
            printf '%s\n\n%s\n' "Audit reached no usable verdict: the report builder failed. [Run]($RUN_URL)" \
              "Read the run's log and the encrypted \`audit-transcript\` artifact." > audit-private.md
          fi
          rm -f "$OUTPUTS"
          [ "$STATUS" = "PASS" ] && exit 0

          # Split rather than truncate: the private issue carries the report
          # whole, as its body and comments. Non-fatal: on a helper failure
          # the body goes up as one part and the tracker takes it or refuses
          # it.
          node scripts/clamp-issue-body.mjs audit-private.md --split \
            --note "The full report is in this run's encrypted \`audit-transcript\` artifact${TRANSCRIPT_URL:+ ([download]($TRANSCRIPT_URL))}." \
            || { echo "clamp-issue-body.mjs failed; filing audit-private.md as one part." >&2; cp audit-private.md audit-private-part-01.md; }

      # The other step that holds `EMBARGO_TOKEN`, and it runs no repository
      # code: only `gh` and shell builtins, on the files `Compose the audit
      # report` wrote. The agent step never has the token in its environment;
      # see docs/specs/security-audit.md -> "Embargo" for what that does and
      # does not stop.
      #
      # Every run reads the findings ledger, a PASS included, because a PASS
      # closes the public issue only when no finding an earlier run filed is
      # still open. A non-PASS run also files its report as one private issue,
      # split across the body and comments so nothing is truncated away.
      #
      # Any failure — no token, no report, a refused call — fails this step
      # loudly and records why for the public step, which says so in public
      # without the detail. Never a fallback that puts the detail anywhere
      # else.
      - name: File embargoed findings
        id: embargo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.EMBARGO_TOKEN }}
          EMBARGO_REPO: diffplug/dormouse-embargo
          STATUS: ${{ steps.compose.outputs.status }}
          RUN_DATE: ${{ steps.compose.outputs.date }}
        run: |
          set -uo pipefail
          fail() {
            echo "result=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$2 The audit's findings were not filed privately; the public issue says so without them."
            exit 1
          }
          [ -n "${GH_TOKEN:-}" ] ||
            fail missing-token "EMBARGO_TOKEN is not set in the security-audit environment."
          # A config directory nothing else wrote, so no leftover `gh`
          # configuration decides where the token is sent. Named rather than
          # made with `mktemp`, so this step runs no program but `gh`.
          GH_CONFIG_DIR="$RUNNER_TEMP/gh-embargo-$GITHUB_RUN_ID-$$"
          [ ! -e "$GH_CONFIG_DIR" ] || fail failed "A gh configuration directory already exists at the fresh path."
          export GH_CONFIG_DIR GH_HOST=github.com
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # The ledger as it stood before this run: every open issue whose
          # title carries an `[audit-finding <key>]` prefix. Read first, so the
          # count handed on is what earlier runs left open.
          [ -f audit-ledger/index.tsv ] ||
            fail no-report "No findings ledger was composed."
          OPEN=$(gh issue list --repo "$EMBARGO_REPO" --state open --limit 1000 \
                   --json number,title \
                   --jq '.[] | select(.title | startswith("[audit-finding ")) | "\(.number) \(.title)"') ||
            fail failed "Reading the findings ledger failed."
          OPEN_COUNT=0
          while read -r row; do [ -n "$row" ] && OPEN_COUNT=$((OPEN_COUNT + 1)); done <<< "$OPEN"

          # Per-run report, for a run that did not pass.
          if [ "${STATUS:-}" != "PASS" ]; then
            shopt -s nullglob
            PARTS=(audit-private-part-*.md)
            [ "${#PARTS[@]}" -gt 0 ] ||
              fail no-report "No private report was composed."
            case "${STATUS:-}" in FAIL) VERDICT=FAIL ;; *) VERDICT=INCONCLUSIVE ;; esac
            DAY="an unknown day"
            [[ "${RUN_DATE:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z$ ]] && DAY="${RUN_DATE%%T*}"
            TITLE="[security-audit] $VERDICT on $DAY at ${GITHUB_SHA:0:7}"
            URL=$(gh issue create --repo "$EMBARGO_REPO" --title "$TITLE" --body-file "${PARTS[0]}") ||
              fail failed "Filing the private issue failed."
            for part in "${PARTS[@]:1}"; do
              gh issue comment "$URL" --body-file "$part" >/dev/null ||
                fail failed "The private issue was filed but $part could not be added to it."
            done
            echo "Filed ${#PARTS[@]} part(s) in the private tracker."
          fi

          # One ledger issue per finding key: opened if none is open, a
          # comment if one is. Never closed here — a human closes it, citing
          # the fix. Row i's title and body are `audit-ledger/<i>.title` and
          # `audit-ledger/<i>.md`, named here rather than read from the index.
          ROW=0; CREATED=0; SEEN=0
          while IFS=$'\t' read -r KEY SEVERITY; do
            ROW=$((ROW + 1))
            [[ "$KEY" =~ ^[0-9a-f]{12}$ ]] || fail failed "Ledger row $ROW has a malformed key."
            case "$SEVERITY" in FAIL|BLOCKER|WARNING) ;; *) fail failed "Ledger row $ROW has a malformed severity." ;; esac
            NUMBER=""
            while read -r row; do
              case "${row#* }" in "[audit-finding $KEY]"*) NUMBER="${row%% *}"; break ;; esac
            done <<< "$OPEN"
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --repo "$EMBARGO_REPO" \
                --body "Seen again as $SEVERITY in [run $GITHUB_RUN_ID]($RUN_URL) at \`${GITHUB_SHA:0:7}\`." >/dev/null ||
                fail failed "Updating ledger issue #$NUMBER failed."
              SEEN=$((SEEN + 1))
            else
              TITLE=$(< "audit-ledger/$ROW.title")
              gh issue create --repo "$EMBARGO_REPO" --title "$TITLE" \
                --body-file "audit-ledger/$ROW.md" >/dev/null ||
                fail failed "Opening a ledger issue failed."
              CREATED=$((CREATED + 1))
            fi
          done < audit-ledger/index.tsv
          echo "open_findings=$OPEN_COUNT" >> "$GITHUB_OUTPUT"
          echo "result=filed" >> "$GITHUB_OUTPUT"
          echo "Ledger: $CREATED opened, $SEEN seen again, $OPEN_COUNT open before this run."

      # The public issue: verdicts, counts, and failed section names, built
      # by `scripts/security-audit-public-body.mjs` and nothing else — no
      # fragment, report, or finding text. PASS closes every open failure
      # issue only when the ledger holds no finding an earlier run left open;
      # anything else files or updates one and exits non-zero, which is what
      # holds the release gate in `release.yml` shut.
      - name: Surface result, file or close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_FRAGMENTS: ${{ steps.plan.outputs.fragments || env.AUDIT_FRAGMENTS }}
          STATUS: ${{ steps.compose.outputs.status }}
          RUN_DATE: ${{ steps.compose.outputs.date }}
          EMBARGO_RESULT: ${{ steps.embargo.outputs.result }}
          OPEN_FINDINGS: ${{ steps.embargo.outputs.open_findings }}
        run: |
          set -eo pipefail
          # A compose step that died before deciding hands on nothing, and
          # nothing is not a pass.
          case "${STATUS:-}" in PASS|FAIL|MISSING) ;; *) STATUS=MISSING ;; esac
          # A count the ledger step did not hand on is unknown, never zero.
          [[ "${OPEN_FINDINGS:-}" =~ ^[0-9]+$ ]] || OPEN_FINDINGS=""
          # The compose step's timestamp, so both issues name the same day.
          DATE="${RUN_DATE:-}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z$ ]] || DATE=$(date -u +%Y-%m-%dT%H:%MZ)
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Idempotent label creation; ignore "already exists" errors.
          gh label create security-audit-failure \
            --color B60205 --description "Security audit failure" 2>/dev/null || true
          # `--limit`: the default lists 30, and an open issue past them would
          # never be reconciled.
          OPEN_ISSUES=$(gh issue list --label security-audit-failure \
                          --state open --limit 1000 --json number --jq '.[].number')

          if [ "$STATUS" = "PASS" ]; then
            if [ "${EMBARGO_RESULT:-}" != "filed" ] || [ -z "$OPEN_FINDINGS" ]; then
              # The ledger could not be read, so whether earlier findings are
              # still open is unknown: nothing is closed, and the run fails.
              for n in $OPEN_ISSUES; do
                gh issue comment "$n" --body "Audit passed at $DATE, but the private findings ledger could not be read, so this stays open. [Run]($RUN_URL)"
              done
              echo "::error::The audit passed but the findings ledger could not be read; no failure issue was closed."
              exit 1
            fi
            for n in $OPEN_ISSUES; do
              if [ "$OPEN_FINDINGS" -eq 0 ]; then
                gh issue close "$n" --comment "Audit passed at $DATE, and no finding is open in the private ledger. [Run]($RUN_URL)"
              else
                gh issue comment "$n" --body "PASS this run at $DATE; $OPEN_FINDINGS finding(s) from earlier runs are still under private review, so this stays open until they are closed. [Run]($RUN_URL)"
              fi
            done
            echo "Audit passed."
            exit 0
          fi

          if [ "$STATUS" = "FAIL" ]; then
            TITLE="[security-audit] FAIL on ${DATE%%T*}"
          else
            TITLE="[security-audit] INCONCLUSIVE on ${DATE%%T*}"
          fi

          # A builder that throws gets a fixed sentence, never a fallback to
          # the report.
          node scripts/security-audit-public-body.mjs \
              --status "$STATUS" --date "$DATE" --run-url "$RUN_URL" --commit "$GITHUB_SHA" \
              --open-findings "$OPEN_FINDINGS" > audit-public.md ||
            printf '%s\n\n%s\n' "The audit did not pass at $DATE. [Run]($RUN_URL)" \
              "The public summary could not be built. Finding details are triaged privately until fixed." > audit-public.md

          case "${EMBARGO_RESULT:-}" in
            filed) ;;
            missing-token) printf '\n%s\n' "**The private filing failed: \`EMBARGO_TOKEN\` is not set.** The details are only in the encrypted transcript." ;;
            no-report) printf '\n%s\n' "**The private filing failed: no private report was composed.** Read the run's log." ;;
            *) printf '\n%s\n' "**The private filing failed.** The details are only in the encrypted transcript; read the run's log for why." ;;
          esac >> audit-public.md

          # Fits by construction; clamped anyway so a pathological count of
          # failed sections cannot get the body rejected.
          node scripts/clamp-issue-body.mjs audit-public.md \
            || echo "clamp-issue-body.mjs failed; posting audit-public.md unclamped." >&2

          EXISTING=$(echo "$OPEN_ISSUES" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file audit-public.md
            # Upward only. FAIL is the ceiling: an inconclusive run must not
            # relabel an issue that already carries real findings, and the
            # title never needs walking back down because a PASS closes the
            # issue outright.
            if [ "$STATUS" = "FAIL" ]; then
              gh issue edit "$EXISTING" --title "$TITLE"
            fi
            echo "Appended $STATUS to issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label security-audit-failure \
              --body-file audit-public.md
          fi
          exit 1
