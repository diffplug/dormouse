name: security-audit

# Audits this repo against SECURITY.md. Runs nightly via the schedule
# trigger and on-demand via workflow_dispatch. release.yml dispatches it
# on the release tag and gates publishing on the result — it dispatches
# rather than calling this workflow with `uses:` because a tag `push`
# would propagate as event_name `push`, which claude-code-action rejects.

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # The three per-domain fragment filenames, in one place. They are
      # named by the redactor's argv, its fail-closed `rm -f`, and the
      # reporting step's guard loop, and drift between two of those lists
      # is precisely what the `FAIL IF` on the redactor exists to catch —
      # a sink that stops being redacted but keeps being published. Every
      # use word-splits this deliberately, so the names must stay
      # space-separated and shell-safe. The artifact `path:` needs one
      # entry per line and so cannot consume it; that list is spelled out
      # and carries a pointer back here.
      AUDIT_FRAGMENTS: audit-supply-chain.md audit-ci-secrets.md audit-application.md
    # Must stay well above the orchestrator's own wait deadline in
    # `.github/audit/orchestrator.md` (25 minutes, counted from the first
    # time its wait loop runs — i.e. after checkout, setup-node, the
    # install, and the spawn — and persisted across the loop's
    # re-issues so it accumulates rather than restarting).
    # At 20 minutes the runner cancelled the job before that deadline
    # could ever fire, so the graceful "give up and report what the
    # domains found" path was unreachable and every overrun landed as
    # INCONCLUSIVE — the exact failure mode the deadline exists to
    # prevent. The slack also covers the merge, verdict, redact, upload,
    # and reporting steps that run after the wait.
    timeout-minutes: 40
    # The AUDIT_PAT (read-only Administration + Secrets + Environments)
    # lives in this environment, whose deployment-branch-policy admits
    # only `main` and `v*` tags — refs that the §3 rulesets reserve to
    # admins. A bot-pushed feature branch cannot reach this job at all
    # (GitHub rejects the run before any step starts), so the PAT
    # cannot be exfiltrated through a hand-authored workflow on a
    # non-admin-gated ref.
    environment:
      name: security-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify AUDIT_PAT is provisioned
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
        run: |
          [ -n "$AUDIT_PAT" ] && exit 0
          echo "FAIL" > audit-status.txt
          echo "**FAIL** — \`AUDIT_PAT\` is not present in the \`security-audit\` environment. See [SECURITY.md > CI Validation Contract](https://github.com/$GITHUB_REPOSITORY/blob/main/SECURITY.md#ci-validation-contract) for provisioning." > audit-report.md
          echo "::error::AUDIT_PAT secret is not set."
          exit 1

      - name: Audit against SECURITY.md
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        env:
          # `claude-code-action` resets `GH_TOKEN` to its own internal
          # workflow token, so setting `GH_TOKEN` at this scope is
          # silently overridden. Expose AUDIT_PAT under its own name
          # and have the prompt instruct Claude to prefix `gh api`
          # calls with `GH_TOKEN=$AUDIT_PAT`.
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # release.yml dispatches this workflow with the default
          # GITHUB_TOKEN, so the actor is `github-actions[bot]`. The
          # action refuses bot-initiated runs unless the bot is allow-
          # listed. This is safe here: the prompt below is hardcoded (no
          # comment/PR/issue injection vector) and the job only runs on
          # admin-gated refs behind the `security-audit` environment. The
          # nightly `schedule` run has a human actor and is unaffected.
          allowed_bots: "github-actions"
          # Without an explicit allowlist the action defaults to a
          # restrictive set that excludes Bash and Write, so an
          # auditing prompt that wants to run `gh api` and produce a
          # report file racks up permission denials and exits without
          # writing audit-status.txt.
          #
          # `--allowed-tools` only auto-approves; it removes nothing. Run
          # 32618922852 proved that the hard way: it passed all 21
          # mechanical checks, handed the qualitative pass to two
          # background subagents, then ended its turn to "wait for the
          # completion notification" — which in a headless SDK run
          # terminates the session, discarding the subagents and leaving
          # both output files unwritten. A clean audit blocked the
          # release gate for $5 and no verdict.
          #
          # The cause was ending the turn, not delegating. `Task` is
          # therefore allowed on purpose — the audit fans out to three
          # scoped domain agents — and the orchestrator prompt carries
          # the rule that makes it safe: block in a Bash `until` loop on
          # the fragment files, never end the turn to wait. `Workflow`
          # stays denied because nothing here should be spawning one.
          # Two of the three domains are mechanical — run a generator, read
          # `gh api`, compare a pin — and the session default (Sonnet)
          # does them well. `application-security` is the one that has to
          # read code adversarially, and its findings have been the ones
          # that needed real reasoning: tracing a relay-minted `clientId`
          # to a keystroke-injection path, or working out that an 8-char
          # fingerprint carries ~40 bits because a P-256 point's leading
          # byte is constant. It runs on Opus; the orchestrator and the
          # other two stay on the cheaper default, so the cost lands only
          # where the depth does.
          #
          # Each agent's prompt is a pointer, not a copy — the content
          # stays in `.github/audit/` so CI and
          # `scripts/security-audit-local.sh` cannot drift apart.
          claude_args: >-
            --allowed-tools "Read,Write,Edit,Bash,Grep,Glob,Task,Agent"
            --disallowed-tools "Workflow"
            --agents '{"supply-chain":{"description":"Audits the Dependency Supply Chain section of SECURITY.md.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/supply-chain.md`, and follow them exactly."},"ci-and-secrets":{"description":"Audits the CI, tend, release, and audit-contract sections of SECURITY.md.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/ci-and-secrets.md`, and follow them exactly."},"application-security":{"description":"Audits the Remote Control section of SECURITY.md, and sweeps the rest of the product code.","prompt":"Read `.github/audit/_preamble.md` and then `.github/audit/application-security.md`, and follow them exactly.","model":"opus"}}'
          # The prompts live in `.github/audit/`, not inline here: they
          # are long enough to need real diffs in review, they must be
          # runnable locally against the same text CI uses
          # (`scripts/security-audit-local.sh`), and the `FAIL IF` that
          # requires every `## ` heading to be owned by exactly one
          # domain is only a grep when those headings sit in markdown.
          # Inline, YAML block-scalar wrapping split
          # `## Automated Maintainer (tend)` across two lines and the
          # check matched nothing.
          prompt: |
            You are the orchestrator of this repository's nightly
            security audit.

            Read `.github/audit/orchestrator.md` and follow it exactly.
            It tells you which subagents to spawn, which prompt files to
            give them, how to wait for them without ending your turn,
            and how to write `audit-report.md` and `audit-status.txt`.

      # The SDK transcript is the only record of what the audit actually
      # did. `claude-code-action` keeps it out of the logs on purpose
      # (`show_full_output` stays off so tool output cannot leak into a
      # public log), and the runner is ephemeral — so without this upload
      # a run that finishes without writing a verdict is undiagnosable
      # after the fact, which is exactly the failure this archive exists
      # to explain. Uploaded unconditionally: a PASS transcript is the
      # baseline you compare a bad one against.
      #
      # This repo is public, so the artifact is world-readable. That is
      # consistent with the audit reports already posted to public
      # issues. It is NOT consistent with log masking: `***` redaction
      # applies to step logs, not to artifact contents, and the SDK
      # serializes every message into this file — Bash `tool_result`
      # bodies included — so raw tool output ships verbatim.
      #
      # The prompt only passes `$AUDIT_PAT` through an unexpanded
      # `GH_TOKEN=` prefix and `gh api` never returns secret values, but
      # that is a convention, not a control: the agent holds unrestricted
      # Bash and is asked to audit code that touches secrets, so one
      # `printenv` or one `set -x` would publish an admin-read PAT for
      # the artifact's whole retention. The step below strips the values
      # verbatim first. That does not stop an agent that encodes a
      # secret, but it closes the accidental-print path, which is the
      # one that actually happens.
      # Both sinks, not just the archive. `audit-report.md` is `cat` into a
      # public issue, which outlives the artifact's 14 days, is indexed, and
      # is emailed to subscribers — and the prompt asks for evidence as
      # "API response excerpt, or command output", so it invites exactly the
      # paste this guards against.
      #
      # Fail closed. `Archive audit transcript` below is `if: always()` and
      # does not depend on this step's outcome, so a throwing redactor would
      # otherwise ship the raw file: on any error, delete every sink
      # instead. Deleted rather than truncated — `: >` has to open the file
      # and so fails on exactly the unreadable file that made the redactor
      # throw, whereas `rm` needs only the directory. A nonzero count is not routine — it means a secret reached
      # a file in cleartext — so it surfaces as an annotation rather than a
      # log line, and the right response is to rotate.
      - name: Redact secrets from agent output
        if: always()
        env:
          AUDIT_PAT: ${{ secrets.AUDIT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TRANSCRIPT="$RUNNER_TEMP/claude-execution-output.json"
          # Every sink that the archive step below publishes has to be in
          # the argument list, and the fail-closed `rm -f` has to delete
          # the same set — SECURITY.md names `audit-report.md`, the three
          # per-domain fragments, and the transcript. The fragments are
          # agent output like any other: a subagent that shells out and
          # prints an environment lands the value in its own fragment,
          # not in the merged report. The fragment names come from the
          # job-level `AUDIT_FRAGMENTS` so this list and the guard loop in
          # the reporting step cannot drift; both expansions below are
          # unquoted on purpose (shellcheck SC2086) because the value is a
          # filename list. Keep every shell comment outside the
          # single-quoted script — inside it, Node parses it as
          # JavaScript and the step fails closed on every run, which
          # `bash -n` does not catch.
          node -e '
            const fs = require("fs");
            let hits = 0;
            for (const p of process.argv.slice(1)) {
              if (!fs.existsSync(p)) continue;
              let s = fs.readFileSync(p, "utf8");
              for (const name of ["AUDIT_PAT", "CLAUDE_CODE_OAUTH_TOKEN"]) {
                const v = process.env[name];
                // Guard against a short or empty value turning into a
                // global replace of something innocuous.
                if (!v || v.length < 8) continue;
                const parts = s.split(v);
                hits += parts.length - 1;
                s = parts.join("***");
              }
              fs.writeFileSync(p, s);
            }
            if (hits > 0) {
              console.log("::warning::Redacted " + hits + " literal secret occurrence(s) from agent output. A secret reached a file in cleartext — rotate AUDIT_PAT and CLAUDE_CODE_OAUTH_TOKEN.");
            } else {
              console.log("No literal secret occurrences found.");
            }
          ' "$TRANSCRIPT" audit-report.md $AUDIT_FRAGMENTS \
            || { rm -f "$TRANSCRIPT" audit-report.md $AUDIT_FRAGMENTS; exit 1; }

      - name: Archive audit transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-transcript
          # The per-domain fragments ride along with the transcript so an
          # orchestrator that dies mid-merge still ships whatever the
          # domains found. Without them an INCONCLUSIVE run reproduces
          # nothing: `audit-report.md` is what the merge would have
          # produced, and the fragments are the only record when it never
          # ran. `if-no-files-found: warn` is load-bearing here — a domain
          # that died legitimately leaves no fragment, and that must not
          # fail the upload.
          #
          # This is the one fragment list that cannot read the job-level
          # `AUDIT_FRAGMENTS` — `path:` wants one entry per line — so it
          # is spelled out and has to be edited in step with that value.
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            audit-report.md
            audit-supply-chain.md
            audit-ci-secrets.md
            audit-application.md
          retention-days: 14
          if-no-files-found: warn

      - name: Surface result, file or close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          # Three outcomes, not two. PASS and FAIL are verdicts the audit
          # reached; MISSING means it never reached one — the agent ended
          # its turn without writing the status file (observed on runs
          # 31927560706 and 32100728239, both of which reported SDK
          # success and simply never called Write). Collapsing MISSING
          # into FAIL, as this step used to, files an identical issue for
          # "the repo is insecure" and "the auditor stopped early",
          # leaving no way to tell a real finding from a no-op run.
          #
          # MISSING still exits non-zero and still files under
          # `security-audit-failure`: an audit that produced no verdict
          # must not let the release gate in `release.yml` pass, and a
          # later PASS should auto-close it like any other failure.
          if [ -s audit-status.txt ]; then
            STATUS=$(tr -d '[:space:]' < audit-status.txt)
          fi
          case "${STATUS:-}" in
            PASS|FAIL) ;;
            *) STATUS=MISSING ;;
          esac

          # A PASS is only as good as the evidence behind it. Each domain
          # writes its own fragment before returning a verdict, so a
          # missing or empty fragment means that domain never reported —
          # and a domain that died silently is indistinguishable, in the
          # merged report, from one that found nothing. §4 of
          # `.github/audit/orchestrator.md` tells the orchestrator to
          # write no status file at all in that case — which lands on the
          # MISSING branch below, not on FAIL — but a prompt is not a
          # control: without this check the matching `FAIL IF` in
          # SECURITY.md is enforced only by the document being audited,
          # which is circular. Downgrade to MISSING rather than FAIL for the same
          # reason the three outcomes exist above — this is an audit that
          # did not finish, not a security finding — and MISSING already
          # exits non-zero and holds the release gate shut.
          if [ "$STATUS" = "PASS" ]; then
            # Unquoted on purpose: `AUDIT_FRAGMENTS` is a filename list.
            # shellcheck disable=SC2086
            for f in $AUDIT_FRAGMENTS; do
              if [ ! -s "$f" ]; then
                echo "::warning::Audit reported PASS but $f is missing or empty; downgrading to INCONCLUSIVE."
                MISSING_FRAGMENTS="${MISSING_FRAGMENTS:+$MISSING_FRAGMENTS, }$f"
                STATUS=MISSING
              fi
            done
          fi

          # Existence is not agreement. The loop above catches a domain that
          # produced nothing; this catches one that produced a FAIL the merge
          # then lost — a mis-summarised verdict, or three domains flattened
          # into an optimistic paragraph. That case is worse than a missing
          # fragment, because PASS *closes* the open failure issue below and
          # opens the release gate, leaving the finding only in a 14-day
          # artifact nobody is looking at.
          #
          # FAIL, not MISSING: a domain that returned FAIL did finish, and it
          # found something. Each subagent is told to make line 1 of its
          # fragment the literal verdict so this grep can exist at all —
          # otherwise the verdict rests on the orchestrator faithfully
          # propagating it, which is the same "a prompt is not a control"
          # shape the missing-fragment guard exists to close.
          if [ "$STATUS" = "PASS" ]; then
            # shellcheck disable=SC2086
            for f in $AUDIT_FRAGMENTS; do
              [ -s "$f" ] || continue
              # Three cases, not two. A fragment whose first line is neither
              # verdict — a subagent that ignored the preamble, a stray heading
              # or blank line — must not fall through to an unchallenged PASS:
              # that would put the verdict back on a prompt having been
              # followed, which is the thing this guard exists to stop being
              # the control. MISSING rather than FAIL, since a report we cannot
              # read is an audit that did not finish rather than a finding, and
              # deliberately not folded into MISSING_FRAGMENTS, whose message
              # says no fragment was left at all.
              case "$(head -n1 "$f")" in
                'VERDICT: FAIL'*)
                  echo "::error::Audit reported PASS but $f opens with VERDICT: FAIL; downgrading to FAIL."
                  DISSENTING="${DISSENTING:+$DISSENTING, }$f"
                  STATUS=FAIL ;;
                'VERDICT: PASS'*) ;;
                *)
                  echo "::warning::$f has no VERDICT line; the dissent check cannot read it."
                  [ "$STATUS" = FAIL ] || STATUS=MISSING ;;
              esac
            done
            if [ -n "${DISSENTING:-}" ]; then
              {
                echo
                echo "---"
                echo
                echo "**Downgraded to FAIL by the reporting step.** The merged verdict was"
                echo "\`PASS\`, but these domain reports open with \`VERDICT: FAIL\`:"
                echo "$DISSENTING."
                echo
                echo "A domain's own verdict outranks the merge."
              } >> audit-report.md
            fi
          fi

          DATE=$(date -u +%Y-%m-%dT%H:%MZ)
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Idempotent label creation; ignore "already exists" errors.
          gh label create security-audit-failure \
            --color B60205 --description "Security audit failure" 2>/dev/null || true

          if [ "$STATUS" = "PASS" ]; then
            # Auto-close any open audit-failure issues so the issue
            # tracker reflects the live state.
            for n in $(gh issue list --label security-audit-failure \
                         --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Audit passed at $DATE. [Run]($RUN_URL)"
            done
            echo "Audit passed."
            exit 0
          fi

          # Deep-link the transcript so the issue points at the evidence
          # rather than at a run page the reader has to dig through. The
          # id lookup needs `actions: read`, which this job holds. Left
          # empty when there is no artifact — a run cancelled on
          # `timeout-minutes` never writes the execution file, and those
          # are exactly the runs a link to the run page would dead-end on,
          # so both consumers below are gated rather than falling back.
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                     --jq '.artifacts[] | select(.name == "audit-transcript") | .id' \
                     2>/dev/null | head -n1 || true)
          if [ -n "$ART_ID" ]; then
            TRANSCRIPT_URL="$RUN_URL/artifacts/$ART_ID"
          else
            TRANSCRIPT_URL=""
          fi

          if [ "$STATUS" = "MISSING" ]; then
            TITLE="[security-audit] INCONCLUSIVE on $(date -u +%Y-%m-%d)"
            {
              # Two different causes reach MISSING, and they want different
              # first moves from the reader: no status file at all means
              # start at the report's own markers — the prose below names
              # both, because that branch itself has two causes (a
              # turn-ending failure mid-audit, and an expired wait deadline)
              # which leave different markers. A downgraded PASS means the
              # named domains are the whole story — the rest reported, and
              # the "ran short, no verdict" prose below would be wrong
              # about a run that did reach one. The named set can be one,
              # two, or all three: the fail-closed `rm -f` in `Redact
              # secrets from agent output` deletes every fragment *and*
              # `audit-report.md` while leaving `audit-status.txt` alone,
              # so a PASS reaches this branch with all three named, no
              # report body, and no transcript link. That path is a
              # cleartext-secret incident, not a flaky domain, so the
              # all-three case says so rather than leaving the reader to
              # infer it from an empty issue.
              if [ -n "${MISSING_FRAGMENTS:-}" ]; then
                echo "Audit verdict withheld at $DATE. [Run]($RUN_URL)"
                echo
                echo "The audit reported \`PASS\`, but it was downgraded: no report"
                echo "fragment was left for: $MISSING_FRAGMENTS. A domain that leaves"
                echo "no fragment did not pass — it did not finish, and a missing"
                echo "fragment is indistinguishable in the merged report from a domain"
                echo "that found nothing. The named domains are unaudited; any report"
                echo "reproduced below covers only the rest. If all three are named,"
                echo "suspect \`Redact secrets from agent output\` — it deletes every"
                echo "fragment and the report when it throws, and that means a secret"
                echo "reached a file in cleartext."
              else
                echo "Audit produced no verdict at $DATE. [Run]($RUN_URL)"
                echo
                echo "The audit step exited without writing \`audit-status.txt\`."
                if [ -s audit-report.md ]; then
                  echo "It did leave a partial \`audit-report.md\`, reproduced below,"
                  echo "which may itself contain a real finding — read it first. A"
                  echo "report without a verdict is the expected shape of an audit that"
                  echo "ran short: the prompt asks for the report either way, and for"
                  echo "the status file only once the verdict covers every check. Start"
                  echo "at the markers rather than the transcript: \`UNVERIFIABLE\` is a"
                  echo "check the agent itself could not determine, while a domain"
                  echo "section reading \`_No report …_\` is a domain that never reported"
                  echo "at all — which is what an expired wait deadline looks like."
                else
                  echo "**This is not a security finding** — the audit did not reach"
                  echo "one. Treat it as a failed audit run, not a failed audit."
                fi
              fi
              if [ -n "$TRANSCRIPT_URL" ]; then
                echo
                echo "[Download the transcript]($TRANSCRIPT_URL) to see where it stopped."
              fi
              if [ -s audit-report.md ]; then
                echo
                echo "---"
                echo
                cat audit-report.md
              fi
            } > audit-comment.md
          else
            TITLE="[security-audit] FAIL on $(date -u +%Y-%m-%d)"
            if [ ! -s audit-report.md ]; then
              printf '%s\n' \
                "Audit reported FAIL but wrote no \`audit-report.md\`." \
                > audit-report.md
            fi
            {
              LINKS="[Run]($RUN_URL)"
              [ -n "$TRANSCRIPT_URL" ] && LINKS="$LINKS · [Transcript]($TRANSCRIPT_URL)"
              echo "Audit failed at $DATE. $LINKS"
              echo
              cat audit-report.md
            } > audit-comment.md
          fi

          EXISTING=$(gh issue list --label security-audit-failure \
                       --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file audit-comment.md
            # Upward only. FAIL is the ceiling: an inconclusive run must not
            # relabel an issue that already carries real findings, and the
            # title never needs walking back down because a PASS closes the
            # issue outright.
            if [ "$STATUS" = "FAIL" ]; then
              gh issue edit "$EXISTING" --title "$TITLE"
            fi
            echo "Appended $STATUS to issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label security-audit-failure \
              --body-file audit-comment.md
          fi
          exit 1
