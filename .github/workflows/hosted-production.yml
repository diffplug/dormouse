name: Hosted production release
on:
  # No dry-run input: a verify-only run reported green and deployed nothing.
  # The environment's required reviewers are the gate; reject there instead.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag: the desktop compatibility gate builds each one.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hosted
      - name: Require every supported desktop release to enroll, connect, and pair against this revision
        run: pnpm --filter dormouse-hosted test:desktop-compat
      - run: pnpm build:hosted
      # npm exits nonzero for a failure anywhere in Hosted's tree; only pgstencil's packages gate here.
      - name: Require each pgstencil package's provenance, npm signature, signer, and source commit, and that commit on main with a passing audit
        working-directory: hosted
        run: |
          npm audit signatures --json --include-attestations > "$RUNNER_TEMP/signatures.json" || true
          node scripts/pgstencil-provenance.mjs "$RUNNER_TEMP/signatures.json"
        env:
          GH_TOKEN: ${{ github.token }}
      # Every Worker's static files, each under its own `dist/<worker>/`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-production-assets
          path: hosted/dist
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: hosted-production
      url: https://hosted.dormouse.sh
    outputs:
      verified-at: ${{ steps.live.outputs.verified-at }}
      deployment-id: ${{ steps.live.outputs.deployment-id }}
    env:
      BUILD_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Each Worker's own Hyperdrive; preflight checks each one's role.
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
      RELAY_HYPERDRIVE_ID: ${{ vars.RELAY_HYPERDRIVE_ID }}
      VOICE_HYPERDRIVE_ID: ${{ vars.VOICE_HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          # A job holding deploy credentials restores no cache another job, an
          # agent-driven one included, could have written.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-production-assets
          path: hosted/dist
      - name: Validate production identities, each Worker's uncached Hyperdrive and role, and its secrets
        run: node hosted/scripts/production.mjs preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Install backup encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Back up and verify decryption and database restore
        run: node hosted/scripts/production-backup.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted/.wrangler/production-backup/*.age
          if-no-files-found: error
          retention-days: 30
      - name: Apply and validate production migrations
        run: pnpm --filter dormouse-hosted db:migrate && pnpm --filter dormouse-hosted db:validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy the frame and try Workers, the relay with its readiness and rendezvous verified, then the voice and account Workers
        run: node hosted/scripts/production.mjs deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live production revisions, readiness, auth boundary and rendezvous
        id: live
        run: |
          node hosted/scripts/production.mjs smoke
          echo "verified-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "deployment-id=$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hosted-release-tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # GITHUB_TOKEN cannot bypass the tag rulesets. The dormouse-hosted-tagger App is a
      # bypass actor for creating `hosted/` tags only; its token is this repository's
      # alone, contents-write, and revoked when the job ends.
      - name: Mint the release-tag App's token
        id: tagger
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOSTED_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOSTED_TAG_APP_PRIVATE_KEY }}
          owner: diffplug
          repositories: dormouse
          permission-contents: write
      - name: Record the verified Hosted deployment
        run: node hosted/scripts/production-tag.mjs
        env:
          GH_TOKEN: ${{ steps.tagger.outputs.token }}
          BUILD_SHA: ${{ github.sha }}
          DEPLOYMENT_VERIFIED_AT: ${{ needs.deploy.outputs.verified-at }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment-id }}
