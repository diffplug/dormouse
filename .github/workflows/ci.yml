name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-node here, unlike every other job: the self-host installer
      # step below runs its own `pnpm install`, which provisions pnpm's pinned
      # runtime (devEngines.runtime) whatever is on PATH. So this job takes its
      # one Node.js from that install and puts it on PATH for the steps that
      # call `node` directly.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Put the pinned Node.js on PATH
        run: |
          set -euo pipefail
          dir="$(pnpm exec node -p 'require("node:path").dirname(process.execPath)')"
          pin="v$("$dir/node" -p 'require("./package.json").devEngines.runtime.version')"
          actual="$("$dir/node" --version)"
          [ "$actual" = "$pin" ] || { echo "::error::pnpm exec node is $actual, not the pinned $pin"; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"

      # The disclosed dependency snapshots are a `FAIL IF` in docs/specs/security-supply-chain.md
      # (Disclosure), but until this step existed the only thing
      # that ever ran the generator was the nightly security audit — strictly
      # after the fact, and only if it reached that check. Two prod-dependency
      # bumps shipped undisclosed that way (`ws` via vscode-ext, `hono` via a
      # Renovate lockfile-only bump). Running it here makes forgetting to
      # regenerate a failed PR instead of a finding filed the next morning.
      #
      # The generator needs `node_modules` to match the lockfile — it resolves
      # every dependency by walking real directories and throws rather than
      # under-reporting — which is exactly what `--frozen-lockfile` above
      # guarantees.
      - name: Dependency disclosure is current
        run: |
          node website/scripts/generate-deps.js
          if ! git diff --quiet -- website/src/data/; then
            echo "::error::The disclosed dependency snapshots are stale. Run \`node website/scripts/generate-deps.js\` and commit the result."
            git --no-pager diff -- website/src/data/
            exit 1
          fi

      # zsh is not on the ubuntu runner image, and it is the default shell on
      # macOS — our primary platform. Without it, `standalone/sidecar`'s
      # shell-integration suite silently covered only bash, which is half of
      # what stands behind an emit-side security fix (docs/specs/terminal-state.md's OSC 633
      # rules; the emitters are the boundary, since the parser cannot defend
      # against a terminator that arrives inside a directory name). The suite
      # names the shells it covered on every run, so a future image change that
      # drops one is visible rather than silent.
      # `update` first: the runner image's apt lists are baked at image build, so
      # once the archive rotates zsh's version the cached Packages entry 404s.
      # `timeout` because a degraded Azure mirror dribbles bytes rather than
      # failing — see the fuller treatment in Standalone Smoketest below, which
      # also rotates mirrors. That much machinery is not worth it for one
      # package; the retry here covers the common case without turning a
      # `Build & Test` red for a reason unrelated to the diff.
      # fish is not on the image either, and comes from the fish project's
      # release-4 PPA: the archive's fish (3.7 on 24.04) predates the OSC 133
      # fish reports itself, which is all the integration a fish pane has
      # (docs/specs/terminal-state.md). pwsh is on the image. The real-shell
      # conformance suite (standalone/sidecar/shell-conformance.test.js) fails
      # the Test step below if any shell DORMOUSE_REQUIRE_SHELLS names is missing.
      # 20 minutes: the budget has to outlast the schedule it wraps, or Actions
      # kills the step mid-attempt and the ::error:: below — the line that says
      # what the failure costs — never prints. Worst case is
      # 3 x (120 PPA + 120 update + 120 install) + 2 x 15 sleep = 1110s, and the
      # last sleep is guarded to keep that `2 x` true.
      - name: Install zsh and fish (shell tests)
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            if sudo timeout 120 add-apt-repository -y -n ppa:fish-shell/release-4 \
               && sudo timeout 120 apt-get update -q \
               && sudo timeout 120 apt-get install -y -q --no-install-recommends zsh fish; then
              fish --version
              exit 0
            fi
            echo "::warning::apt attempt $i for zsh and fish failed or timed out"
            if [ "$i" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::could not install zsh and fish; the shell suites need both"
          exit 1

      # Library tests have their own runner. test:other finishes the checkout
      # isolation check before overlapping audit and package tests.
      - name: Test
        timeout-minutes: 20
        env:
          DORMOUSE_REQUIRE_SHELLS: zsh,bash,fish,pwsh
        run: pnpm test:other

      - name: Build
        run: pnpm build

      # The Linux installer is the only one CI can execute, and most of what it
      # does is shared with its two siblings: the release build, the staging,
      # the self-contained runtime copy, the candidate health probe on an
      # ephemeral port, the `current` switch, the prune, and the generated
      # `manage`. Test mode stops short of systemd and Serve, and the injected
      # origin is what lets it run on a machine with no tailnet.
      - name: Self-host installer (Linux, test mode)
        env:
          DORMOUSE_INSTALL_TEST: '1'
          DORMOUSE_INSTALL_ORIGIN: https://ci.example.ts.net
        run: |
          set -euo pipefail
          root="$(mktemp -d)/dormouse-relay"
          offer="$root/run/enroll-offer.json"
          # Prints the token, because it must rotate on every run before the
          # first Host enrollment — and this job is the only executable check.
          #
          # The shape check is the server's own `isEnrollmentOffer`, imported
          # rather than restated: a CI copy of the token regex and the origin
          # rule is free to drift from the validator the redemption path
          # actually runs, and then agrees with itself while the server rejects
          # what the installer writes. No build step is needed for it: the
          # `Test` step above builds remote-lib-common, as does the
          # `pnpm --filter relay build` inside every install below.
          # The single-quoted script is JavaScript, so its `${…}` is not shell's.
          # shellcheck disable=SC2016
          read_offer() {
            node --input-type=module -e '
              import { readFileSync, statSync } from "node:fs";
              import { isEnrollmentOffer } from "./remote-lib-common/dist/index.js";
              const [path, wantOrigin] = process.argv.slice(1);
              const mode = statSync(path).mode & 0o777;
              if (mode !== 0o600) throw new Error(`${path} is mode ${mode.toString(8)}, expected 600`);
              const offer = JSON.parse(readFileSync(path, "utf8"));
              if (!isEnrollmentOffer(offer)) throw new Error(`not an enrollment offer: ${JSON.stringify(offer)}`);
              // Beyond the structural guard, and nothing else checks it: the
              // server hard-rejects a mintedAt it cannot parse, which the shape
              // guard — a length bound — accepts.
              if (Number.isNaN(Date.parse(offer.mintedAt))) throw new Error(`mintedAt is ${offer.mintedAt}`);
              if (offer.origin !== wantOrigin) throw new Error(`origin is ${offer.origin}`);
              process.stdout.write(offer.token);
            ' "$offer" "$DORMOUSE_INSTALL_ORIGIN"
          }
          # Twice: the first is a first install, the second exercises the update
          # path — previous pointer, prune, and preserving config/relay.env.
          DORMOUSE_INSTALL_ROOT="$root" ./deploy/local/install-linux.sh --yes
          before="$(sha256sum "$root/config/relay.env" | cut -d' ' -f1)"
          first_token="$(read_offer)"
          DORMOUSE_INSTALL_ROOT="$root" ./deploy/local/install-linux.sh --yes
          after="$(sha256sum "$root/config/relay.env" | cut -d' ' -f1)"
          second_token="$(read_offer)"
          [ "$before" = "$after" ] || { echo "::error::relay.env was not preserved across an update"; exit 1; }
          [ "$first_token" != "$second_token" ] || { echo "::error::the enrollment offer was not re-minted on the update"; exit 1; }
          # burrows.json existence, not its current row count, is the durable
          # "first Burrow happened" marker. Even an empty hand-edited file keeps
          # a later installer run from reopening bootstrap.
          printf '[]\n' > "$root/state/burrows.json"
          chmod 0600 "$root/state/burrows.json"
          DORMOUSE_INSTALL_ROOT="$root" ./deploy/local/install-linux.sh --yes
          [ ! -e "$offer" ] || { echo "::error::the enrollment offer survived after burrows.json existed"; exit 1; }
          [ -L "$root/previous" ] || { echo "::error::no previous release retained after an update"; exit 1; }
          bash -n "$root/bin/manage"
          bash -n "$root/bin/run-relay"
  library-test:
    name: Library Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # --no-runtime: setup-node above already put the pinned Node.js on PATH,
      # so pnpm does not download the same devEngines.runtime from nodejs.org.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      # browser-launch-env.test.ts skips its real POSIX shell cases without zsh.
      - name: Install zsh (browser shell tests)
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if sudo timeout 120 apt-get update -q \
               && sudo timeout 120 apt-get install -y -q --no-install-recommends zsh; then
              exit 0
            fi
            echo "::warning::apt attempt $i for zsh failed or timed out"
            if [ "$i" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::could not install zsh; the browser shell tests would silently skip zsh"
          exit 1

      # Includes the library's pretest builds and typecheck on a fresh checkout.
      # The library suite runs with Vitest's default worker settings.
      - name: Test library
        timeout-minutes: 20
        run: pnpm test:lib

  # The workflows themselves: actionlint for syntax, expressions, and the
  # shell in every `run:` block; zizmor for GitHub Actions security
  # (`.github/zizmor.yml` names each accepted exception). The repository's own
  # workflow rules — docs/specs/security-ci.md's `FAIL IF` lines — are
  # `scripts/workflow-lint.mjs`, which runs in `test:checks` above. Both tools
  # sit outside the lockfile, so each is pinned exactly and verified by hash
  # (docs/specs/security-supply-chain.md -> "Cooldown and alerts").
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint

      # Uses the runner's preinstalled shellcheck for `run:` blocks.
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

      - name: Install zizmor
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --require-hashes --only-binary :all: --no-deps -r .github/zizmor-requirements.txt

      # Online, so impostor commits and known-vulnerable pins are checked too;
      # the token reads public repositories only.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format github .github/workflows'

  webview-smoketest:
    name: Webview Boot Smoketest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Its own job, in parallel with Build & Test: pinning a browser's cost to a
    # job keeps `pnpm test` free of it. It is also the only check that runs the
    # shipped webview bundle rather than inspecting it — the VS Code webview's CSP is enforced by Chromium, so a
    # policy that blocks the app is invisible to every string-level test we have
    # (docs/specs/vscode.rationale.md -> "CSP policy").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Frozen for the same supply-chain reason as every other job here;
      # --no-runtime as in Library Tests.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      # `playwright-core` ships no browser, deliberately — a unit-test run should
      # not drag one down. Fetch it here, where it is actually used.
      - name: Install Chromium
        run: pnpm --filter dormouse exec playwright-core install --with-deps chromium

      # The smoketest loads what the build emits, so the build has to precede
      # it. `build:frontend` alone — this job never touches the extension host
      # bundle — and it reads every workspace package from source, so a clean
      # checkout needs no other build first.
      - name: Build the webview frontend
        run: pnpm --filter dormouse build:frontend

      - name: Smoketest
        run: pnpm --filter dormouse test:smoke

  frame-origin-check:
    name: Frame Origin Check
    runs-on: ubuntu-latest
    # The only check that runs a frame origin's worker, bootstrap page, bridge,
    # and socket shim in a real browser, cross-site, under the Hosted handler's
    # headers: registration, control, and interception are the browser's, so a
    # unit test's fake scope cannot see them break.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # --no-runtime as in Library Tests.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Chromium
        run: pnpm --filter dormouse-lib exec playwright-core install --with-deps chromium

      - name: Check
        timeout-minutes: 10
        run: pnpm check:frame-origin

  standalone-smoketest:
    name: Standalone Smoketest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `cargo check` runs standalone/src-tauri/build.rs, which fails the build
      # unless the Node.js on PATH exactly matches package.json's
      # devEngines.runtime.version pin. setup-node's node-version-file reads that
      # exact pin from package.json (volta.node → devEngines.runtime →
      # engines.node), so the smoketest can't drift off the pin the way a bare
      # `node-version: 24` would when the runner image bumps its 24.x.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # rustup ships on every GitHub-hosted runner, so no third-party action
      # installs the toolchain: dtolnay/rust-toolchain force-pushes the branch
      # its SHA pin points into on every upstream change, which turns the pin
      # into an impostor commit for zizmor.
      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Install system dependencies
        # apt mirrors are flaky: a healthy run finishes in <1min, but a degraded
        # Azure mirror can dribble bytes for 15-80min, and retrying the SAME mirror
        # doesn't help. Wrap each apt call in `timeout` (turns "slow" into a failed
        # attempt) and rotate the mirror host between attempts so a sustained
        # single-mirror problem is escaped. Azure first (fast, same datacenter),
        # archive.ubuntu.com as fallback. --no-install-recommends trims the download.
        # The runner image's ubuntu.sources points at mirror+file:/etc/apt/apt-mirrors.txt,
        # which lists the hosts, so that file is the one the rotation has to rewrite.
        #
        # 16 minutes, not 10: the budget has to outlast the schedule it wraps, or
        # Actions kills the step mid-attempt and the ::error:: below — the line
        # that says the mirrors were rotated and still failed — never prints,
        # leaving a bare timeout in exactly the sustained-outage case the mirror
        # rotation exists for. Worst case is
        # 3 x (120 update + 180 install) + 3 x 15 sleep = 945s (the loop
        # sleeps after the third failed attempt too, before the ::error::).
        timeout-minutes: 16
        run: |
          mirrors=(azure.archive.ubuntu.com archive.ubuntu.com)
          src_files=(/etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list)
          for i in 0 1 2; do
            host=${mirrors[$(( i % ${#mirrors[@]} ))]}
            for f in "${src_files[@]}"; do
              [ -f "$f" ] && sudo sed -i -E "s|https?://[a-z.]*archive\.ubuntu\.com/ubuntu|http://$host/ubuntu|g" "$f"
            done
            echo "::group::apt attempt $((i + 1)) via $host"
            if sudo timeout 120 apt-get update -q && \
               sudo timeout 180 apt-get install -y -q --no-install-recommends \
                 libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "::warning::apt via $host failed or timed out; rotating mirror, retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts across mirrors"
          exit 1

      # Frozen for the same supply-chain reason as every other job here;
      # --no-runtime as in Library Tests, which also leaves build.rs the
      # setup-node binary on PATH that it checks against the pin.
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile --no-runtime
        working-directory: standalone

      # The frontend half of the release's `tauri build`: staging `dor` and the
      # sidecar bundles (with their relay-origin and nothing-inlined
      # assertions), `tsc -b`, which is the TypeScript check, and the Vite
      # build. Run nowhere else before a release tag.
      - name: Build
        run: pnpm run build
        working-directory: standalone

      # `cargo test` rather than `cargo check`: the crate carries unit tests
      # (path/session/sidecar resolution in lib.rs) that no job ran, so they
      # compiled at most as `cargo check` and never executed. Building the test
      # harness also links, which `check` does not.
      - name: Cargo test
        run: cargo test
        working-directory: standalone/src-tauri

  standalone-platform-check:
    # The job above runs on Linux only, so it compiles none of the crate's
    # `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` code — two whole modules
    # (clipboard_win.rs, pe_subsystem.rs), the platform arms throughout lib.rs
    # and build.rs, and the unit tests gated with them. Without this job their
    # first compile is the Windows / macOS leg of release.yml, which runs only on
    # a `v*` tag: a typo in Windows-only Rust surfaces as a failed release rather
    # than as a failed PR. Deliberately a separate job from the smoketest above,
    # so that job keeps its registered check name.
    name: Standalone Platform Check (${{ matrix.platform }})
    strategy:
      # Each platform's compile is independent; a Windows failure must not hide
      # what macOS would have said.
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    # A hung compile on a premium-billed runner must not ride the 6-hour job
    # default. Cold-cache runs land at ~2min (macOS) and ~5min (Windows).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin-driven setup as the smoketest above: build.rs fails unless the
      # Node.js on PATH matches package.json's devEngines.runtime.version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # Same direct rustup install as the smoketest above.
      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # Windows and macOS runners bill at a multiple of Linux, so the dependency
      # compile is cached rather than paid on every PR.
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: standalone/src-tauri

      # The full TypeScript check stays on Linux. This job covers native Rust,
      # the dor launchers, and actual shell execution for browser initialization
      # and for the paths a drop types into cmd and PowerShell.
      - name: Cargo test
        run: cargo test
        working-directory: standalone/src-tauri

      # `dor.cmd` is the one launcher only Windows can run. The test needs Node
      # alone — no install, no build — so it rides this job rather than a
      # Windows runner of its own.
      - name: dor launcher test
        run: node --test dor/test/launcher.test.mjs

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # These small suites need no native addon builds; --no-runtime as in
      # Library Tests.
      - name: Install shell test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-runtime

      # Every earlier step runs pwsh 7, so the tests below are the first to
      # start Windows PowerShell 5.1 on this runner. Its first starts there are
      # cold: about 1.5s each and, now and then, past 15s, with concurrent first
      # starts finishing together; by the third start it takes about 300ms.
      # Those tests bound each shell they start (10s, 15s), so a cold start
      # failed them while pwsh and cmd.exe stayed fast. Pay it here, unbounded
      # by any test, and log each start so a slow runner shows in this step.
      # The step itself runs in pwsh, as the tests do, so even its first 5.1
      # start is timed rather than spent starting the step. Each start also
      # calls ConvertTo-Json, as the shell-escape tests do: its module's first
      # load is a separate cold cost (1.2-3s after a warm start, and 10s on a
      # runner whose first start took 11s).
      - name: Warm Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          foreach ($start in 1..10) {
            $ms = [int](Measure-Command { powershell.exe -NoProfile -NonInteractive -Command '& node -e 0; $null = ConvertTo-Json 0' }).TotalMilliseconds
            "Windows PowerShell start ${start}: $ms ms"
            if ($ms -lt 1000) { exit 0 }
          }
          "::warning::Windows PowerShell still starts slowly; the shell tests below may time out"

      # The syntax gate for the two shipped PowerShell scripts, which nothing
      # else loads; both must run on Windows PowerShell 5.1, so its parser
      # reads them. A parse does not check that a cmdlet exists:
      # scripts/ps1-cmdlet-lint.mjs covers the installer's names.
      - name: Parse the PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in 'deploy/local/install-windows.ps1', 'standalone/sidecar/shell-integration/pwsh/shellIntegration.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "::error file=$file,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Windows browser host and shell tests
        run: pnpm --dir lib exec vitest run src/host/browser-launch-env.test.ts src/host/agent-browser-host.test.ts src/lib/shell-escape.test.ts

      # fish is on no runner image; zsh, bash 3.2, and pwsh are on macOS's.
      # No `brew update`: the image's formula data is recent enough for one
      # bottle, and an update costs minutes.
      - name: Install fish (shell conformance)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install fish && fish --version

      # The whole sidecar suite, real shells included: the Linux job is the only
      # other place it runs, and macOS's bash is 3.2. The conformance suite
      # fails if a shell DORMOUSE_REQUIRE_SHELLS names is missing.
      - name: Sidecar tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          DORMOUSE_REQUIRE_SHELLS: zsh,bash,fish,pwsh
        run: pnpm --filter dormouse-sidecar test

      # node-pty ships the Windows addon and ConPTY DLL as prebuilds, so the
      # install above suffices. The Linux suite cannot exercise native close,
      # nor any Windows shell. The conformance suite writes the runner's own
      # PowerShell profiles, which no environment variable moves.
      - name: Windows PTY and shell tests
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          DORMOUSE_REQUIRE_SHELLS: pwsh,powershell,cmd,git-bash
          DORMOUSE_CONFORMANCE_WRITE_PROFILE: '1'
        run: pnpm exec node --test --test-force-exit standalone/sidecar/graceful-kill-windows.test.js standalone/sidecar/pty-host-wiring.test.js standalone/sidecar/pty-core.test.js standalone/sidecar/shell-conformance.test.js

      # Output flow control on real ConPTY: a paused PTY blocks its program,
      # resumes for input, and still delivers its tail and exit. The package
      # suites run these on Linux, which cannot show what ConPTY does.
      - name: Windows PTY flow-control tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --dir standalone exec vitest run src/sidecar-flow-control.test.ts
          pnpm --dir vscode-ext exec vitest run test/pty-host-flow.test.ts

      # The package suites run on Linux, where these cases skip: `.cmd` shims
      # and UNC working directories, ACL-preserving saves, PATHEXT, and the WSL
      # caller. Only the Windows cases run here, by name; the tests import each
      # package's `dist`.
      - name: Windows package tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --filter dor-lib-common --filter dor-tools-builtin --filter dor run build
          node --test --test-name-pattern="reads the target of agent-browser, npm cmd-shim and pnpm shims" --test-name-pattern="a \.cmd shim started in a UNC cwd" --test-name-pattern="on a case-insensitive volume" --test-name-pattern="Windows saves preserve" --test-name-pattern="a native replacement sharing failure" --test-name-pattern="already carries an extension as itself" --test-name-pattern="a WSL caller" dor-lib-common/test/spawn.test.mjs dor-lib-common/test/local-path.test.mjs dor-tools-builtin/test/editable-file.test.mjs dor-tools-builtin/test/atomic-save.test.mjs dor/test/cli-output.test.mjs dor/test/wsl-paths.test.mjs

      # The macOS installer's `owner_only` meets a real BSD `stat` only here.
      - name: Installer helper tests
        if: runner.os == 'macOS'
        run: node scripts/installer-verify-test.mjs
