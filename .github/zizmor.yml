# zizmor configuration for `.github/workflows/ci.yml`'s `Workflow lint` job.
# Every ignore names its reason; docs/specs/security-ci.md owns the rules
# these exceptions answer to, and `scripts/workflow-lint.mjs` checks the ones
# zizmor cannot express (file-scoped exceptions, effective permissions).
rules:
  unpinned-uses:
    config:
      policies:
        # The one documented tag pin: tend's generated workflows reference
        # its action by version (docs/specs/security-ci.md -> "Upstream
        # compromise"); `scripts/workflow-lint.mjs` keeps it to `tend-*.yaml`.
        "max-sixty/tend/*": ref-pin
        "*": hash-pin
  dangerous-triggers:
    ignore:
      # Agent-managed, generated by tend, and exempt from the
      # `pull_request_target` rule (docs/specs/security-ci.md -> "GitHub
      # Actions Policies"); "Automated Maintainer (tend)" bounds them.
      - tend-review.yaml
      - tend-ci-fix.yaml
  artipacked:
    ignore:
      # tend checks out with `TEND_BOT_TOKEN` so the agent can push; the
      # files are regenerated nightly and cannot carry inline ignores.
      - tend-ci-fix.yaml
      - tend-mention.yaml
      - tend-nightly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-review.yaml
      - tend-triage.yaml
      - tend-weekly.yaml
      # Its classifier fetches every branch and arbitrary commits from
      # origin after checkout; it runs only on `main` and is not testable
      # from a branch, so the credential stays until it can be exercised.
      - workflow-audit.yaml
      # The audit agent already holds a workflow token through
      # claude-code-action; dropping this one is untestable from a branch,
      # since the `security-audit` environment admits only `main` and `v*`.
      - security-audit.yaml
  use-trusted-publishing:
    ignore:
      # Neither the VS Code Marketplace nor Open VSX accepts OIDC trusted
      # publishing; the tokens live only in `vscode-extension-publish`.
      - release.yml
