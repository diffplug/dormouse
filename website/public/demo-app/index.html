<!doctype html>
<!-- The app the homepage's VS Code demo has "running" in its browser pane: a
     static stand-in for a dev server's page. Not linked from anywhere else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acorn — Settings</title>
<style>
  :root { color-scheme: dark; --bg: #16130f; --panel: #211c16; --line: #3a3128; --text: #efe6da; --dim: #a8998a; --accent: #e0a458; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  nav { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .logo { font-weight: 700; letter-spacing: .02em; }
  .logo span { color: var(--accent); }
  nav a { color: var(--dim); text-decoration: none; font-size: 13px; }
  nav a.on { color: var(--text); }
  main { padding: 22px 20px; max-width: 560px; }
  h1 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row small { display: block; color: var(--dim); font-size: 12px; }
  .toggle { flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 19px; background: #1b150e; }
  .new { margin-left: 6px; padding: 1px 6px; border-radius: 6px; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; }
</style>
</head>
<body>
  <nav>
    <div class="logo">acorn<span>.</span></div>
    <a href="#">Today</a>
    <a href="#">Habits</a>
    <a href="#" class="on">Settings</a>
  </nav>
  <main>
    <h1>Settings</h1>
    <div class="card">
      <div class="row"><div>Dark mode<span class="new">new</span><small>Follows your system until you choose.</small></div><div class="toggle on"></div></div>
      <div class="row"><div>Daily reminder<small>A nudge at the time you pick.</small></div><div class="toggle on"></div></div>
      <div class="row"><div>Week starts on</div><select><option>Monday</option></select></div>
      <div class="row"><div>Share streaks<small>Friends can see your longest run.</small></div><div class="toggle"></div></div>
    </div>
  </main>
</body>
</html>
