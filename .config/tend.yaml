bot_name: dormouse-bot
merge: restricted

# Trusted runner steps on the base tree, before the agent starts. Only
# scripts/setup-git.mjs (Node built-ins, no dependency code): it defines
# the md-sentences merge driver, so the agent's own merges of markdown go
# sentence by sentence once it has installed dependencies. No runner-side
# step merges, so the driver runs only inside the agent's sandbox.
setup:
  - name: Define the markdown merge driver
    run: node scripts/setup-git.mjs

# Both checks read the tag layout docs/specs/security-ci.md requires as a
# failure; its audited rules hold the real properties instead. Acceptance
# covers the whole check name, so a new environment problem still has to
# get past S55, which fails on any environment
# .github/audit/expected-github-state.json does not name.
checks:
  accepted:
    tag-protection: "S52 and S68 split tag protection: Tag operations covers ~ALL except refs/tags/hosted/**, which Hosted tag creation and Hosted tag history cover; scripts/github-state-check.mjs audits all three"
    credential-environments: "Builds on the tag-protection verdict. S55 (scripts/github-state-check.mjs) admin-gates every environment's refs, and S67 (scripts/workflow-lint.mjs) pins hosted-release-tag to the tag job, which needs the review-gated deploy"

secrets:
  allowed:
    - CHROMATIC_PROJECT_TOKEN
    - ARGOS_TOKEN

workflows:
  weekly:
    # After the Sunday 15:00 UTC reset of the org's weekly Claude quota.
    # GitHub only ever delays a scheduled run, so the default 09:17 slot
    # has always started before the reset.
    cron: "17 15 * * 0"
  ci-failures:
    watched_workflows:
      - CI
      - Argos
