[package]
name = "dormouse"
version = "1.1.0"
description = "Persistent multitasking terminal for mice (and hotkey wizards too)"
authors = ["DiffPlug"]
license = "FSL-1.1-MIT"
edition = "2021"

[lib]
name = "dormouse_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
process-wrap = { version = "10", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    # restrict_to_owner's Windows arm: the DACL that stands in for 0700/0600.
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The tao the app ships, driven directly by tests/objc_exception_unwinds.rs.
tao = { version = "0.35", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDictionary", "NSException", "NSGeometry", "NSString"] }

[[test]]
name = "objc_exception_unwinds"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
# Never "abort": an Objective-C exception must unwind through Rust frames to
# AppKit. Rust panics abort through `panic_policy::abort_on_panic` instead
# (docs/specs/standalone.md -> "Objective-C exceptions").
panic = "unwind"

[patch.crates-io]
# tao with extern "C-unwind" Apple callbacks, and tao-macros from the same repo
# so one copy resolves (docs/specs/standalone.md -> "Objective-C exceptions").
tao = { git = "https://github.com/diffplug/tao", rev = "397f6789285412024892579aff0897aade11d832" }
tao-macros = { git = "https://github.com/diffplug/tao", rev = "397f6789285412024892579aff0897aade11d832" }
